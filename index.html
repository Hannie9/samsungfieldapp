<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Field App - Shop Detail Demo Store Profile Staffing v21</title>
  <!-- build: detail-demo-sales-v1-v17-driver-first-rank-refine -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --samsung-blue: #1428A0;
      --blue-500: #2B5CFF;
      --blue-soft: #EEF3FF;
      --ink: #0B0B0F;
      --text: #111111;
      --muted: #6B7280;
      --subtle: #9CA3AF;
      --surface: #F4F6FA;
      --card: #FFFFFF;
      --line: rgba(0,0,0,.07);
      --warning: #F59E0B;
      --danger: #D92D20;
      --success: #18A058;
      --purple: #7C3AED;
      --shadow-soft: 0 16px 45px rgba(0,0,0,.08);
      --shadow-float: 0 24px 70px rgba(10,22,70,.16);
      --font: "Be Vietnam Pro", Inter, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 75% 8%, rgba(20,40,160,.18), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #eef2f7 100%);
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .phone {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      border-radius: 42px;
      background:
        radial-gradient(circle at 86% 4%, rgba(20,40,160,.13), transparent 25%),
        linear-gradient(180deg, #FFFFFF 0%, #F4F6FA 82%);
      box-shadow: var(--shadow-float);
      border: 10px solid #0D0D10;
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      border-radius: 999px;
      background: #0D0D10;
      z-index: 40;
    }

    .screen {
      height: 100%;
      padding: 22px 18px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -.02em;
      flex: 0 0 auto;
    }

    .signal { display: flex; align-items: center; gap: 5px; color: #111; }
    .battery { width: 24px; height: 12px; border: 1.7px solid #111; border-radius: 4px; position: relative; }
    .battery::before { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: #111; border-radius: 2px; }
    .battery::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 6px; border-radius: 2px; background: #111; }

    .app-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      flex: 0 0 auto;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 16px;
      background: #000;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.04em;
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
    }

    .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-bottom: 2px; }
    .brand strong { display: block; font-size: 20px; letter-spacing: -.055em; line-height: 1; }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 70% 20%, rgba(0,212,255,.55), transparent 30%),
        linear-gradient(135deg, var(--samsung-blue), var(--blue-500));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      border: 0;
      box-shadow: 0 12px 26px rgba(20,40,160,.25);
    }

    .content {
      margin-top: 14px;
      padding-bottom: 84px;
      overflow: auto;
      scrollbar-width: none;
      flex: 1 1 auto;
    }
    .content::-webkit-scrollbar { display: none; }

    .shop-page-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .guide-button {
      min-height: 74px;
      border: 0;
      border-radius: 26px;
      text-align: left;
      padding: 14px 15px;
      color: #fff;
      background:
        radial-gradient(circle at 92% 0%, rgba(0,212,255,.25), transparent 35%),
        linear-gradient(135deg, #0B0B0F 0%, #17235D 100%);
      box-shadow: 0 16px 34px rgba(20,40,160,.18);
      transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s;
    }
    .guide-button:active, .filter-chip:active, .shop-card:active { transform: scale(.985); }
    .guide-button strong { display: flex; align-items: center; gap: 7px; font-size: 14px; letter-spacing: -.04em; }
    .guide-button small { display: block; margin-top: 5px; color: rgba(255,255,255,.72); font-size: 11px; font-weight: 500; line-height: 1.28; }
    .guide-spark { width: 22px; height: 22px; border-radius: 10px; display: inline-grid; place-items: center; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.13); }

    .shop-page-counter {
      width: 76px;
      border-radius: 26px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.055);
      box-shadow: 0 8px 24px rgba(0,0,0,.055);
      display: grid;
      place-items: center;
      text-align: center;
    }
    .shop-page-counter strong { display: block; font-size: 25px; letter-spacing: -.08em; color: var(--samsung-blue); }
    .shop-page-counter small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 600; }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
      margin: 14px 0 10px;
      padding-bottom: 2px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: #333;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 7px 18px rgba(0,0,0,.035);
      transition: transform .16s cubic-bezier(.2,.8,.2,1), background .16s, color .16s;
    }
    .filter-chip.active { background: #000; color: #fff; border-color: #000; }
    .filter-chip span { opacity: .62; font-size: 11px; }

    .shop-search-wrap {
      height: 48px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.045);
    }
    .shop-search-wrap svg { width: 17px; height: 17px; color: var(--subtle); flex: 0 0 auto; stroke-width: 2.4; }
    .shop-search-wrap input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }
    .shop-search-wrap input::placeholder { color: var(--subtle); font-weight: 500; }

    .shop-list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 2px 10px;
    }
    .shop-list-head h2 { margin: 0; font-size: 17px; letter-spacing: -.045em; }
    .shop-list-head span { font-size: 12px; color: var(--muted); font-weight: 600; }

    .shop-list { display: grid; gap: 14px; }

    .shop-card {
      width: 100%;
      border: 1px solid rgba(0,0,0,.055);
      border-radius: 30px;
      background: #fff;
      padding: 14px;
      text-align: left;
      box-shadow: 0 12px 30px rgba(0,0,0,.065);
      overflow: hidden;
      transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s, border-color .16s;
    }
    .shop-card.selected { border-color: rgba(20,40,160,.26); box-shadow: 0 14px 32px rgba(20,40,160,.10); }
    .shop-card-top {
      display: grid;
      grid-template-columns: 124px 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .shop-photo {
      height: 132px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(12,18,40,.86), rgba(20,40,160,.70)),
        radial-gradient(circle at 82% 18%, rgba(0,212,255,.65), transparent 28%),
        linear-gradient(90deg, #20243A 0 28%, #30364D 28% 32%, #0E1430 32% 68%, #3A4055 68% 72%, #1C2136 72% 100%);
    }
    .shop-photo::before {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      top: 18px;
      height: 44px;
      border-radius: 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
    }
    .photo-sign {
      position: absolute;
      left: 20px;
      top: 32px;
      color: #fff;
      letter-spacing: .15em;
      font-size: 10px;
      font-weight: 600;
    }
    .photo-meta {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 13px;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 500;
    }

    .shop-ref-info { min-width: 0; padding-top: 2px; }
    .shop-ref-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .grade-status-pill {
      min-height: 29px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-radius: 999px;
      background: #F1F3F5;
      color: #111;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .grade-status-pill i {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #49C78A;
      box-shadow: 0 0 0 4px rgba(73,199,138,.12);
    }

    .usecase-dots { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .case-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; box-shadow: 0 0 0 4px rgba(20,40,160,.06); }
    .case-dot.red { background: var(--danger); }
    .case-dot.orange { background: var(--warning); }
    .case-dot.blue { background: var(--blue-500); }
    .case-dot.purple { background: var(--purple); }
    .case-dot.yellow { background: #FACC15; }
    .case-more { height: 22px; min-width: 26px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #111; color: #fff; font-size: 10px; font-weight: 500; }

    .shop-ref-name {
      color: #0B0B0F;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: 1.05;
      margin-bottom: 5px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .shop-ref-subtitle { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.25; margin-bottom: 10px; }
    .shop-ref-signal {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 9px;
      white-space: nowrap;
    }
    .shop-ref-signal .star { color: #FF8B6B; font-size: 16px; line-height: 1; }
    .shop-ref-signal strong { color: #FF8B6B; font-size: 13px; letter-spacing: -.025em; }
    .bullet { color: #9CA3AF; }
    .shop-ref-focus {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6B7FC8;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.1;
    }
    .shop-ref-focus span {
      width: 20px;
      height: 20px;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: #6B7FC8;
      font-size: 11px;
    }

    .shop-location-strip {
      min-height: 52px;
      border-radius: 18px;
      background: #F1F2F6;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px 11px;
      margin-top: 13px;
      color: #111;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }
    .loc-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .loc-icon svg { width: 18px; height: 18px; stroke-width: 2.4; }
    .strip-arrow {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      font-size: 18px;
      font-weight: 500;
    }

    .shop-case-scroll {
      display: flex;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
      margin-top: 12px;
      padding-bottom: 1px;
    }
    .shop-case-scroll::-webkit-scrollbar { display: none; }
    .shop-case-tile {
      flex: 0 0 94px;
      min-height: 68px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.07);
      background: #fff;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 9px 8px;
      text-align: center;
      box-shadow: 0 5px 14px rgba(0,0,0,.035);
    }
    .shop-case-tile.active { background: #F1F2F6; }
    .shop-case-tile small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.15; }
    .shop-case-tile strong { display: block; margin-top: 5px; color: #111; font-size: 14px; font-weight: 600; letter-spacing: -.045em; }

    .empty-state {
      border-radius: 24px;
      background: #fff;
      border: 1px dashed rgba(0,0,0,.15);
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
    }


    .view { display: none; animation: fadeUp .24s cubic-bezier(.2,.8,.2,1); }
    .view.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bottom-nav {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      height: 68px;
      border-radius: 28px;
      background: rgba(255,255,255,.90);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(0,0,0,.065);
      box-shadow: 0 14px 36px rgba(0,0,0,.10);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px;
      z-index: 25;
    }
    .nav-item {
      border: 0;
      background: transparent;
      height: 52px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--subtle);
      font-size: 9px;
      font-weight: 500;
      padding: 4px 0;
    }
    .nav-item svg { width: 18px; height: 18px; stroke-width: 2.3; }
    .nav-item.active { background: var(--blue-soft); color: var(--samsung-blue); }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3,7,18,.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
      z-index: 28;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: #fff;
      border-radius: 34px 34px 0 0;
      padding: 12px 18px 22px;
      box-shadow: 0 -20px 60px rgba(0,0,0,.18);
      transform: translateY(106%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.show { transform: translateY(0); }
    .grabber { width: 44px; height: 5px; border-radius: 999px; background: #D7DCE5; margin: 0 auto 16px; }
    .sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .sheet-head h2 { margin: 0; font-size: 22px; letter-spacing: -.06em; }
    .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 500; }
    .close { width: 34px; height: 34px; border-radius: 999px; border: 0; background: #F1F3F5; color: #111; font-weight: 500; }
    .guide-list { display: grid; gap: 8px; }
    .guide-case-row {
      width: 100%;
      border: 1px solid rgba(0,0,0,.055);
      border-radius: 20px;
      background: #F7F8FC;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      text-align: left;
      align-items: center;
    }
    .guide-case-row strong { display: block; font-size: 13px; letter-spacing: -.035em; }
    .guide-case-row small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 3px; line-height: 1.3; }
    .guide-case-count { min-width: 36px; height: 36px; border-radius: 14px; display: grid; place-items: center; background: #fff; color: var(--samsung-blue); font-weight: 600; font-size: 13px; }
    .dark-card {
      margin-top: 11px;
      border-radius: 26px;
      padding: 15px;
      background:
        radial-gradient(circle at 95% 0%, rgba(0,212,255,.24), transparent 35%),
        linear-gradient(135deg, #0B0B0F 0%, #17235D 100%);
      color: #fff;
      box-shadow: 0 18px 34px rgba(20,40,160,.18);
    }
    .ai-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dark-card strong { font-size: 14px; letter-spacing: -.035em; }
    .dark-card p { margin: 0; color: rgba(255,255,255,.75); font-size: 12px; line-height: 1.45; font-weight: 500; }
    .spark { width: 32px; height: 32px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.12); }

    .toast {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      min-height: 46px;
      border-radius: 999px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9,12,20,.94);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      z-index: 50;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .22s, transform .22s;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateY(0); }



    /* Vietnamese typography tuning */
    h1, h2, h3,
    .brand strong,
    .guide-button strong,
    .shop-list-head h2,
    .shop-ref-name,
    .shop-case-tile strong,
    .sheet-head h2,
    .guide-case-row strong,
    .dark-card strong {
      letter-spacing: -.018em !important;
      line-height: 1.22 !important;
    }

    .statusbar,
    .logo-mark,
    .shop-page-counter strong,
    .shop-ref-signal strong,
    .photo-sign,
    .grade-status-pill,
    .case-more,
    .shop-ref-subtitle,
    .shop-location-strip,
    .shop-case-tile small,
    .guide-case-row small,
    button,
    input,
    small,
    p {
      letter-spacing: 0 !important;
    }

    /* Softer typography pass: reduce over-bold UI and keep Vietnamese marks airy */
    body { font-weight: 400; text-rendering: optimizeLegibility; }

    .brand strong,
    .shop-ref-name,
    .shop-list-head h2,
    .guide-button strong,
    .sheet-head h2,
    .dark-card strong,
    .guide-case-row strong {
      font-weight: 600 !important;
    }

    .photo-sign,
    .case-more,
    .guide-case-count,
    .shop-page-counter strong,
    .strip-arrow,
    .close {
      font-weight: 600 !important;
    }

    .brand small,
    .statusbar,
    .guide-button small,
    .filter-chip,
    .shop-search-wrap input,
    .shop-search-wrap input::placeholder,
    .shop-list-head span,
    .photo-meta,
    .shop-ref-subtitle,
    .shop-ref-signal,
    .shop-ref-focus,
    .shop-location-strip,
    .shop-case-tile small,
    .empty-state,
    .nav-item,
    .sheet-head p,
    .guide-case-row small,
    .toast {
      font-weight: 400 !important;
    }

    .grade-status-pill,
    .shop-case-tile strong,
    .shop-ref-signal strong,
    .avatar,
    .logo-mark,
    .shop-page-counter small {
      font-weight: 500 !important;
    }



    /* Final Vietnamese typography + balanced sizing pass */
    html, body, button, input {
      font-family: "Be Vietnam Pro", Arial, "Helvetica Neue", sans-serif !important;
      font-synthesis: none;
    }
    body {
      text-rendering: optimizeLegibility !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .brand strong {
      font-size: 18px !important;
      font-weight: 600 !important;
      letter-spacing: 0 !important;
      line-height: 1.28 !important;
    }

    /* Demo mapping theo shop để filter nhìn thật hơn:
       - Không auto gán mọi issue cho cùng một shop.
       - Severity càng cao càng tiêu cực, dùng để sort từ xấu nhất tới tốt hơn. */
    const shopUsecaseProfiles = {
      'cp-le-van-viet': {
        belowTimeGone: { value: '% Ach 69%', severity: 13 },
        peopleShort: { value: '+1 Headcount', severity: 10 },
        productivityDrop: { value: 'Giảm 6.2 triệu', severity: 6.2 }

    const $ = (sel) => document.querySelector(sel);

    function competitorGrowthPts(shop) {
      const competitors = shop.competitor.shares.filter(item => item.brand !== 'SS');
      return Math.max(0, ...competitors.map(item => item.delta || 0));
    }

    function isBelowTimeGone(shop) {
      return shop.ach < shop.timeGone;
    }

    function shopUsecases(shop) {
      const profiles = shopUsecaseProfiles[shop.id] || {};
      return guideSegments
        .filter(item => profiles[item.key])
        .map(item => ({
          key: item.key,
          label: item.label,
          tone: item.tone,
          value: profiles[item.key].value,
          severity: profiles[item.key].severity || 0
        }))
        .sort((a, b) => b.severity - a.severity);
    }

    function usecaseSeverity(shop, filter = state.filter) {
      const profiles = shopUsecaseProfiles[shop.id] || {};
      if (filter !== 'all') return profiles[filter]?.severity ?? -1;
      const values = Object.values(profiles).map(item => item.severity || 0);
      return values.length ? Math.max(...values) : -1;
    }

    function matchesUsecase(shop, filter = state.filter) {
      if (filter === 'all') return true;
      return shopUsecases(shop).some(item => item.key === filter);
    }

    function matchesSearch(shop) {
      const q = state.shopSearch.trim().toLowerCase();
      if (!q) return true;
      return [shop.name, shop.code, shop.region, shop.channel, shop.address].some(value => String(value).toLowerCase().includes(q));
    }

    function visibleShops() {
      return shops
        .filter(shop => matchesUsecase(shop) && matchesSearch(shop))
        .sort((a, b) => {
          const severityDiff = usecaseSeverity(b) - usecaseSeverity(a);
          if (severityDiff !== 0) return severityDiff;
          return (a.rank || 999) - (b.rank || 999);
        });
    }

    function countByFilter(filter) {
      return shops.filter(shop => matchesUsecase(shop, filter)).length;
    }

    function suggestedUsecases() {
      return guideSegments;
    }

    function usecaseValue(shop, item) {
      const profileValue = shopUsecaseProfiles[shop.id]?.[item.key]?.value;
      if (profileValue) return profileValue;

      const hcGap = shop.samsung.people.planned - shop.samsung.people.actual;
      const ihsDrop = Math.abs(Math.min(shop.ihsDelta || -4, -4));
      const productivityDrop = Math.max(2.5, Math.round(Math.abs(shop.ach - shop.timeGone) * 0.42 * 10) / 10);
      if (item.key === 'belowTimeGone') return `% Ach ${shop.ach}%`;
      if (item.key === 'peopleShort') return `+${Math.max(0, hcGap)} Headcount`;
      if (item.key === 'productivityDrop') return `Giảm ${productivityDrop} triệu`;
      if (item.key === 'competitorIhsDrop') return `Giảm ${ihsDrop}%`;
      return 'Check';
    }

    function filterTone(key) {
      const match = guideSegments.find(item => item.key === key);
      if (match) return match.tone;
      if (key === 'belowTimeGone') return 'red';
      if (key === 'peopleShort' || key === 'mcs') return 'blue';
      if (key === 'productivityDrop') return 'orange';
      if (key === 'competitorIhsDrop') return 'purple';
      if (key === 'display') return 'yellow';
      return 'blue';
    }

    function gradeStarCount(grade) {
      const value = String(grade || '').trim().toUpperCase();
      if (value.startsWith('A')) return 5;
      if (value.startsWith('B')) return 4;
      if (value.startsWith('C')) return 3;
      return 3;
    }

    function renderGradeRating(grade) {
      const filled = gradeStarCount(grade);
      const stars = Array.from({ length: 5 }, (_, index) => `<span class="${index < filled ? 'filled' : 'empty'}">★</span>`).join('');
      return `<span class="grade-rating" aria-label="Grade ${grade}, ${filled} sao"><span class="grade-stars">${stars}</span><span class="grade-text">Grade ${grade}</span></span>`;
    }

    function renderUsecaseDots(cases) {
      if (!cases.length) return '<span class="usecase-none">On track</span>';
      const maxDots = 6;
      const dots = cases.slice(0, maxDots).map(item => `<span class="case-dot ${item.tone}" title="${item.label}" aria-label="${item.label}"></span>`).join('');
      const more = cases.length > maxDots ? `<span class="case-more usecase-more">+${cases.length - maxDots}</span>` : '';
      return `<span class="usecase-inline-dots">${dots}${more}</span>`;
    }

    function renderUsecaseSummaryPill(cases) {
      if (!cases.length) {
        return `<span class="usecase-summary-pill on-track"><span class="usecase-mini-stack"><span class="usecase-mini-dot"></span></span><span>On track</span></span>`;
      }
      const dots = cases.slice(0, 3).map(item => `<span class="usecase-mini-dot ${item.tone}" title="${item.label}"></span>`).join('');
      const label = cases.length === 1 ? '1 issue' : `${cases.length} issues`;
      return `<span class="usecase-summary-pill"><span class="usecase-mini-stack">${dots}</span><span>${label}</span></span>`;
    }

    function activeUsecaseMetric(shop) {
      if (state.filter === 'all') return null;
      const usecase = shopUsecases(shop).find(item => item.key === state.filter) || { key: state.filter, label: filterMap[state.filter], tone: filterTone(state.filter) };
      return {
        tone: usecase.tone || filterTone(state.filter),
        text: usecaseValue(shop, usecase)
      };
    }

    const TOTAL_SHOP_BASE = 100;
    const SHOP_PAGE_SIZE = 10;

    function activeUsecaseSummary(displayedCount = 0) {
      const summaryText = {
        all: 'Tổng hợp các shop trong listing usecase. Chọn chip để xem nhóm issue đang cần ưu tiên.',

      const tone = state.filter === 'all' ? '' : filterTone(state.filter);
      return {
        title: filterMap[state.filter] || 'Usecase',
        subtitle: summaryText[state.filter] || 'Nhóm shop đang cần kiểm tra theo usecase được chọn.',
        metric: state.filter === 'all' ? '' : `${displayedCount}/${TOTAL_SHOP_BASE}`,
        tone
      };
    }

        'HCM West': 'Ho Chi Minh',

        'dmx-nguyen-trai': 'Nguyễn Minh Anh',
        'cp-le-van-viet': 'Trần Hoàng Nam',
        'vhc-da-nang': 'Lê Thanh Huyền'

    }

    function shopListingCard(shop) {
      const cases = shopUsecases(shop);
      const dots = cases.slice(0, 2).map(item => `<span class="case-dot ${item.tone}" title="${item.label}"></span>`).join('');
      const more = cases.length > 2 ? '<span class="case-more">2+</span>' : '';
      const metric = activeUsecaseMetric(shop);
      const topIndicator = metric
        ? `<span class="active-case-metric ${metric.tone}">${metric.text}</span>`
        : renderUsecaseSummaryPill(cases);

      return `
        <button class="shop-card ${shop.id === state.selectedShopId ? 'selected' : ''}" data-action="open-shop-detail" data-shop="${shop.id}">
          <div class="shop-card-top">

    function getShopById(id) {

    function pctWidth(value) {
      const num = Number(value) || 0;
      return Math.max(0, Math.min(100, num));
    }

    function achTone(ach) {
      if (ach < 72) return 'red';
      if (ach < 80) return 'orange';
      return 'green';
    }

    function signedText(value) {
      const num = Number(value) || 0;
      if (num > 0) return `+${num}`;
      return String(num);
    }

    function trendTone(text) {
      return String(text || '').trim().startsWith('-') ? 'negative' : 'positive';
    }

    function strongestIssue(shop) {
      const cases = shopUsecases(shop);
      if (!cases.length) return { label: 'On track', tone: 'green', value: 'Ổn định' };
      return cases[0];
    }

    function samsungDiagnosis(shop) {
      const worstCategory = shop.samsung.categories.reduce((acc, item) => item.ach < acc.ach ? item : acc, shop.samsung.categories[0]);
      const worstSegment = shop.samsung.segments.reduce((acc, item) => item.ach < acc.ach ? item : acc, shop.samsung.segments[0]);
      const promoModel = shop.samsung.models.find(item => /promo|price|cashback|bundle|bonus|drop/i.test(item.promo)) || shop.samsung.models[0];
      return `MTD Ach <strong>${shop.samsung.mtd.ach}%</strong> đang hụt chủ yếu ở <strong>${worstCategory.name}</strong> và segment <strong>${worstSegment.name}</strong>. Model <strong>${promoModel.model}</strong> có ${promoModel.promo} nên dùng để kéo sellout ngắn hạn.`;
    }

    function activeCompetitorCompare() {
      return competitorCompareOptions.find(item => item.key === state.competitorCompare) || competitorCompareOptions[0];
    }

    function competitorDelta(item, index = 0) {
      const option = activeCompetitorCompare();
      const base = item.delta || 0;
      if (option.key === 'lw') return base;
      const direction = base === 0 ? (index % 2 === 0 ? 1 : -1) : Math.sign(base);
      const noise = option.key === 'l2w' ? (index % 3) - 1 : option.key === 'l4w' ? (index % 4) - 1 : (index % 5) - 2;
      return Math.round((base * option.factor + direction * Math.abs(noise) * 0.45) * 10) / 10;
    }

    function competitorDeltaTone(value) {
      return value > 0 ? 'up' : value < 0 ? 'down' : 'flat';
    }

    function competitorCompareSuffix() {
      return `vs ${activeCompetitorCompare().label}`;
    }

    function competitorDiagnosis(shop) {
      const ss = shop.competitor.shares.find(item => item.brand === 'SS');
      const biggestThreat = shop.competitor.shares
        .map((item, index) => ({ ...item, activeDelta: competitorDelta(item, index) }))
        .filter(item => item.brand !== 'SS')
        .sort((a, b) => (b.activeDelta || 0) - (a.activeDelta || 0))[0];
      const ssIndex = shop.competitor.shares.findIndex(item => item.brand === 'SS');
      return `SS đang giữ <strong>${ss.share}%</strong> contribution, biến động <strong>${signedText(competitorDelta(ss, ssIndex))} pts</strong> ${competitorCompareSuffix()}. Áp lực chính đến từ <strong>${biggestThreat.brand}</strong> tăng <strong>${signedText(biggestThreat.activeDelta)} pts</strong>, nên soi nhân sự, display, sellout và top model.`;

    function estimateTargetAmount(actualLabel, ach) {
      const raw = String(actualLabel || '').trim();
      const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)(.*)$/);
      if (!match) return raw;
      const value = Number(match[1]);
      const suffix = match[2] || '';
      const pct = Number(ach) || 0;
      if (!value || !pct) return raw;
      const target = value / (pct / 100);
      const decimals = suffix.toLowerCase().includes('b') ? 1 : 0;
      return `${target.toFixed(decimals)}${suffix}`;
    }

      const qty = Number(actualQty) || 0;

      if (!qty || !pct) return qty;
      return Math.max(qty, Math.round(qty / (pct / 100)));

    function competitorDefaultBrand(shop) {
      return 'SS';
    }

    function activeCompetitorBrand(shop) {
      const rows = shop.competitor.shares.filter(item => item.brand !== 'OTHERS');
      if (state.competitorBrand && rows.some(item => item.brand === state.competitorBrand)) return state.competitorBrand;
      return competitorDefaultBrand(shop);
    }

    function competitorStrongestGrower(shop) {
      const rows = shop.competitor.shares.filter(item => item.brand !== 'OTHERS' && item.brand !== 'SS');
      const ranked = rows
        .map((item, index) => ({ ...item, deltaNow: competitorDelta(item, index + 1) }))
        .filter(item => item.deltaNow > 0)
        .sort((a, b) => b.deltaNow - a.deltaNow || b.share - a.share);
      return ranked[0]?.brand || competitorDefaultBrand(shop);
    }

    function competitorBrandLabel(brand) {
      const names = { SS: 'Samsung', LG: 'LG', TCL: 'TCL', SN: 'Sony', TOS: 'Toshiba', HISEN: 'Hisense', OTHERS: 'Others' };
      return names[brand] || brand;
    }

    function competitorCalloutLabel(brand) {
      const names = { TOS: 'TOSHIBA', HISEN: 'HISEN', OTHERS: 'OTHERS' };
      return names[brand] || competitorBrandLabel(brand).toUpperCase();
    }

    function competitorTreemapStyle(brand) {
      const palette = {
        SS: { border: '#1428A0', fill: '#EEF3FF', text: '#1428A0' },
        LG: { border: '#D92D20', fill: '#FEF3F2', text: '#B42318' },
        TCL: { border: '#7C3AED', fill: '#F3E8FF', text: '#6D28D9' },
        SN: { border: '#16A34A', fill: '#ECFDF3', text: '#15803D' },
        TOS: { border: '#F97316', fill: '#FFF7ED', text: '#C2410C' },
        HISEN: { border: '#0F766E', fill: '#CCFBF1', text: '#115E59' },
        OTHERS: { border: '#64748B', fill: '#F1F5F9', text: '#334155' }
      };
      return palette[brand] || palette.OTHERS;
    }

    function competitorShareText(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return `${value}%`;
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function renderCompetitorVoronoi(shop) {
      const order = ['SS', 'LG', 'TCL', 'SN', 'OTHERS', 'TOS', 'HISEN'];
      const map = new Map(shop.competitor.shares.map(item => [item.brand, item]));
      const rows = order.map(brand => map.get(brand)).filter(Boolean);
      const rowIndex = new Map(rows.map((item, index) => [item.brand, index]));
      const explicitBrand = state.competitorBrand && rows.some(item => item.brand === state.competitorBrand) ? state.competitorBrand : null;
      const smallBrandOrder = ['TOS', 'HISEN', 'OTHERS'];
      const smallBrands = new Set(smallBrandOrder);
      const ssShare = Number(map.get('SS')?.share) || 59.5;
      const smallItemsForLayout = smallBrandOrder.map(brand => map.get(brand)).filter(Boolean);
      const smallTotal = smallItemsForLayout.reduce((sum, item) => sum + (Number(item.share) || 0), 0);
      const smallH = smallTotal > 0 ? Math.max(7.2, Math.min(11, smallTotal)) : 0;
      const mainH = Math.max(1, 100 - smallH);
      const topCompetitorTotal = ['LG', 'TCL', 'SN'].reduce((sum, brand) => sum + (Number(map.get(brand)?.share) || 0), 0);
      const rightXBySamsung = ssShare / mainH * 100;
      const rightXByCompetitors = 100 - (topCompetitorTotal / mainH * 100);
      const rightX = Math.max(44, Math.min(70, (rightXBySamsung + rightXByCompetitors) / 2));
      const rightW = Math.max(1, 100 - rightX);
      const layout = {};
      layout.SS = { x: 0, y: 0, w: rightX, h: mainH };

      const topRawHeights = ['LG', 'TCL', 'SN'].map(brand => {
        const item = map.get(brand);
        const rawH = item ? ((Number(item.share) || 0) / rightW * 100) : 0;
        return { brand, rawH };
      });
      const rawTotalH = topRawHeights.reduce((sum, item) => sum + item.rawH, 0) || mainH;
      const scaleH = mainH / rawTotalH;
      let cursorY = 0;
      topRawHeights.forEach(({ brand, rawH }, index) => {
        const item = map.get(brand);
        if (!item) return;
        const h = index === topRawHeights.length - 1 ? Math.max(0, mainH - cursorY) : rawH * scaleH;
        layout[brand] = { x: rightX, y: cursorY, w: rightW, h };
        cursorY += h;
      });

      const smallY = mainH;
      let smallX = 0;
      smallItemsForLayout.forEach((item, index) => {
        const remainingBrands = smallItemsForLayout.slice(index);
        const remainingShare = remainingBrands.reduce((sum, row) => sum + (Number(row.share) || 0), 0) || 1;
        const remainingW = Math.max(0, 100 - smallX);
        const w = index === smallItemsForLayout.length - 1 ? remainingW : ((Number(item.share) || 0) / remainingShare) * remainingW;
        layout[item.brand] = { x: smallX, y: smallY, w, h: smallH };
        smallX += w;
      });

      function treemapTextVars(box, isSmall, share) {
        if (isSmall) return '--brand-fs:0px;--value-fs:0px;--cell-pad:0px;';
        const shareNum = Math.max(0, Number(share) || 0);
        const area = Math.max(0, (Number(box.w) || 0) * (Number(box.h) || 0) / 100);
        const root = Math.sqrt(area);
        let valueFs = 16 + root * 2.4;
        if (shareNum >= 50) valueFs = 42;
        else if (shareNum >= 12) valueFs = 25;
        else if (shareNum >= 10) valueFs = 23;
        else if (shareNum >= 8) valueFs = 21;
        valueFs = Math.round(Math.max(18, Math.min(42, valueFs)) * 10) / 10;
        let brandFs = 9.4 + root * .55;
        if (shareNum >= 50) brandFs = 14.5;
        else if (shareNum >= 12) brandFs = 12.1;
        else if (shareNum >= 8) brandFs = 11.3;
        brandFs = Math.round(Math.max(10.2, Math.min(14.5, brandFs)) * 10) / 10;
        const cellPad = Math.round(Math.max(8, Math.min(14, shareNum >= 50 ? 14 : 7 + root * .55)) * 10) / 10;
        return `--brand-fs:${brandFs}px;--value-fs:${valueFs}px;--cell-pad:${cellPad}px;`;
      }
      function treemapDeltaText(value, withSuffix = false) {
        const num = Number(value) || 0;
        const magnitude = Math.abs(num);
        const display = Number.isInteger(magnitude) ? String(magnitude) : magnitude.toFixed(1);
        const sign = num > 0 ? '+' : num < 0 ? '−' : '';
        return `${sign}${display}%${withSuffix ? ` vs ${activeCompetitorCompare().label}` : ''}`;
      }
      const cells = rows.map((item, index) => {
        const box = layout[item.brand] || { x: 0, y: 0, w: 0, h: 0 };
        const colors = competitorTreemapStyle(item.brand);
        const isSmall = smallBrands.has(item.brand) || item.share < 5;
        const isActive = explicitBrand ? item.brand === explicitBrand : false;
        const dataAction = item.brand === 'OTHERS' ? '' : `data-action="competitor-brand" data-brand="${item.brand}"`;
        const delta = competitorDelta(item, index);
        const deltaTone = competitorDeltaTone(delta);
        return `<button class="voronoi-cell treemap-cell share-treemap-cell cell-${index} brand-${item.brand.toLowerCase()} ${isSmall ? 'is-small' : ''} ${isActive ? 'active' : ''}" ${dataAction} type="button" aria-pressed="${isActive ? 'true' : 'false'}" aria-label="${competitorBrandLabel(item.brand)} ${competitorShareText(item.share)} IHS tại shop, ${treemapDeltaText(delta, true)}" style="--x:${box.x}%;--y:${box.y}%;--w:${box.w}%;--h:${box.h}%;--cell-border:${colors.border};--cell-fill:${colors.fill};--cell-text:${colors.text};${treemapTextVars(box, isSmall, item.share)}">
            <div class="voronoi-brand"><b>${competitorBrandLabel(item.brand)}</b><span class="treemap-delta delta-${deltaTone}">${treemapDeltaText(delta)}</span></div>
            <div class="voronoi-value"><strong>${competitorShareText(item.share)}</strong></div>
          </button>`;
      }).join('');
      const smallItems = smallBrandOrder.map(brand => map.get(brand)).filter(Boolean);
      const callouts = smallItems.map((item, calloutIndex) => {
        const box = layout[item.brand] || { x: 0, y: 0, w: 0, h: 0 };
        const colors = competitorTreemapStyle(item.brand);
        const dataAction = item.brand === 'OTHERS' ? '' : `data-action="competitor-brand" data-brand="${item.brand}"`;
        const anchorY = Math.max(6, Math.min(98, box.y + box.h));
        const anchorX = Math.max(6, Math.min(98, box.x + box.w / 2));
        const delta = competitorDelta(item, rowIndex.get(item.brand) || 0);
        const deltaTone = competitorDeltaTone(delta);
        return `<button class="treemap-callout callout-${item.brand.toLowerCase()}" ${dataAction} type="button" style="--anchor-x:${anchorX}%;--anchor-y:${anchorY}%;--callout-x:${box.x}%;--callout-w:${box.w}%;--cell-border:${colors.border};--cell-fill:${colors.fill};--cell-text:${colors.text};" aria-label="${competitorBrandLabel(item.brand)} ${competitorShareText(item.share)}, ${treemapDeltaText(delta, true)}"><i></i><span class="treemap-callout-brand"><strong>${competitorCalloutLabel(item.brand)}</strong><span class="treemap-delta delta-${deltaTone}">${treemapDeltaText(delta)}</span></span><span class="treemap-callout-value"><em>${competitorShareText(item.share)}</em></span></button>`;
      }).join('');
      const connectorPaths = smallItems.map((item) => {
        const box = layout[item.brand] || { x: 0, y: 0, w: 0, h: 0 };
        const colors = competitorTreemapStyle(item.brand);
        const x = Math.max(4, Math.min(96, box.x + box.w / 2));
        return `<circle cx="${x.toFixed(2)}" cy="1.6" r="1.15" fill="${colors.border}"/><path d="M ${x.toFixed(2)} 3.2 L ${x.toFixed(2)} 18" fill="none" stroke="${colors.border}" stroke-width="1.35" stroke-linecap="round" opacity=".92"/>`;
      }).join('');
      const connectors = `<svg class="treemap-connector-layer" viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">${connectorPaths}</svg>`;
      return `<div class="treemap-wrap treemap-with-bottom-callouts"><div class="voronoi-map treemap-map share-treemap-map ${explicitBrand ? 'has-active' : ''}" aria-label="Competitor IHS treemap">${cells}</div>${connectors}<div class="treemap-external-callouts treemap-bottom-callouts" aria-label="Chú thích các mảnh nhỏ nằm dưới treemap">${callouts}</div></div>`;
    }

    function competitorInsightProfile(shop, brand) {
      const shopName = shop.name;
      const base = {
        SS: { channel: `${shop.channel} ${signedText(shop.ihsDelta)} pts`, region: `${shop.region} ${signedText(shop.ihsDelta)} pts`, store: shopName, reason: 'baseline Samsung tại cửa hàng này.' },
        LG: { channel: 'DMX +3.2 pts', region: 'HCM West +3.0 pts', store: 'DMX Nguyễn Trãi', reason: 'OLED entry, gift tag và bundle audio kéo conversion.' },
        TCL: { channel: 'CP +4.1 pts', region: 'HCM East +3.6 pts', store: 'CP Lê Văn Việt', reason: 'Mini LED value + island gần lối vào làm tăng traffic.' },
        SN: { channel: 'VHC +2.7 pts', region: 'Central +2.4 pts', store: 'VHC Đà Nẵng', reason: 'demo zone premium và tư vấn OLED cao cấp.' },
        HISEN: { channel: 'Modern Trade +1.6 pts', region: 'HCM Fringe +1.4 pts', store: 'DMX Tân Phú', reason: 'giá 65up thấp, chốt khách value-seeker.' },
        TOS: { channel: 'Mass +0.8 pts', region: 'Central +0.6 pts', store: 'CP Tam Kỳ', reason: 'entry SKU chạy tốt ở shelf thường.' }
      };
      const profile = base[brand] || base.LG;
      if (shop.id === 'cp-le-van-viet' && brand === 'TCL') return { ...profile, channel: 'CP +4.6 pts', region: 'HCM East +3.9 pts', store: shopName, reason: 'TCL đang thắng ở Mini LED 55 và island ngay lối vào.' };
      if (shop.id === 'dmx-nguyen-trai' && brand === 'LG') return { ...profile, channel: 'DMX +3.8 pts', region: 'HCM West +3.4 pts', store: shopName, reason: 'LG OLED entry thấp giá hơn và quà soundbar rõ hơn.' };
      if (shop.id === 'vhc-da-nang' && brand === 'SN') return { ...profile, channel: 'VHC +3.0 pts', region: 'Central +2.8 pts', store: shopName, reason: 'SN tăng demo premium và kéo trust ở OLED 65.' };
      return profile;
    }

    function renderCompetitorLiftCard(shop) {
      const brand = activeCompetitorBrand(shop);
      const rows = shop.competitor.shares.filter(item => item.brand !== 'OTHERS');
      const index = rows.findIndex(item => item.brand === brand);
      const item = rows[index] || rows[0];
      const delta = competitorDelta(item, index);
      const tone = competitorDeltaTone(delta);
      const profile = competitorInsightProfile(shop, brand);
      const peopleShare = pct(competitorPeopleForBrand(shop, brand), competitorPeopleTotal(shop));
      const displayShare = pct(competitorDisplayBays(shop, brand), competitorDisplayTotal(shop));
      const verb = delta > 0 ? 'đang bành trướng' : delta < 0 ? 'đang co lại' : 'đi ngang';
      const lead = delta > 0
        ? `IHS tăng ${signedText(delta)} pts; soi ngay phần tăng theo channel, region và store tiêu biểu.`
        : delta < 0
          ? `IHS giảm ${signedText(delta)} pts; vẫn nên kiểm tra driver để giữ nhịp phòng thủ.`
          : `IHS chưa đổi rõ; đổi mốc so sánh để xem brand nào đang tăng mạnh.`;
      return `<div class="competitor-lift-card expansion-card">
        <div class="competitor-lift-head">
          <div><strong>${brand} ${verb}</strong><p>${lead}</p></div>
          <span class="lift-pill ${tone}">${signedText(delta)} pts ${competitorCompareSuffix()}</span>
        </div>
        <div class="expansion-score-row">
          <div class="expansion-score"><small>Nhân sự</small><strong>${peopleShare}%</strong></div>
          <div class="expansion-score"><small>Display</small><strong>${displayShare}%</strong></div>
          <div class="expansion-score"><small>IHS sellout</small><strong>${item.share}%</strong></div>
        </div>
        <div class="competitor-lift-grid">
          <div class="lift-mini"><small>Channel tăng</small><strong>${profile.channel}</strong></div>
          <div class="lift-mini"><small>Region tăng</small><strong>${profile.region}</strong></div>
          <div class="lift-mini"><small>Store tiêu biểu</small><strong>${profile.store}</strong></div>
        </div>
      </div>`;
    }

    function competitorTopModelForBrand(shop, brand) {
      if (brand === 'SS') return shop.samsung.models[0]?.model || '—';
      const pin = shop.competitor.pins.find(item => item.comp.toUpperCase().startsWith(brand) || (brand === 'SN' && item.comp.toUpperCase().startsWith('SN')));
      if (pin) return pin.comp;
      const fallback = {
        LG: 'LG OLED65B5',
        TCL: 'TCL 55C755',
        SN: 'SN XR65A95L',
        HISEN: 'Hisense U7N 65',
        TOS: 'Toshiba C350 55',
        OTHERS: 'Mixed low-end'
      };
      return fallback[brand] || '—';
    }

    function competitorPeopleForBrand(shop, brand) {
      const p = shop.competitor.people;
      const map = { SS: p.ss, LG: p.lg, TCL: p.tcl, SN: p.sn, HISEN: 1, TOS: 1, OTHERS: 0 };
      return map[brand] ?? 0;
    }

    function competitorPeopleTotal(shop) {
      const brands = shop.competitor.shares.map(item => item.brand);
      return brands.reduce((sum, brand) => sum + competitorPeopleForBrand(shop, brand), 0) || 1;
    }

    function competitorDisplayBays(shop, brand) {
      const baseByShop = {
        'dmx-nguyen-trai': { SS: shop.samsung.display.actual, LG: 6, TCL: 5, SN: 3, HISEN: 2, TOS: 1, OTHERS: 1 },
        'cp-le-van-viet': { SS: shop.samsung.display.actual, LG: 4, TCL: 5, SN: 2, HISEN: 2, TOS: 1, OTHERS: 1 },
        'vhc-da-nang': { SS: shop.samsung.display.actual, LG: 4, TCL: 3, SN: 4, HISEN: 1, TOS: 1, OTHERS: 1 }
      };
      const fallback = { SS: shop.samsung.display.actual, LG: 4, TCL: 4, SN: 2, HISEN: 1, TOS: 1, OTHERS: 1 };
      return (baseByShop[shop.id] || fallback)[brand] ?? 0;
    }

    function competitorDisplayTotal(shop) {
      return shop.competitor.shares.reduce((sum, item) => sum + competitorDisplayBays(shop, item.brand), 0) || 1;
    }

    function pct(part, total) {
      return Math.round((part / Math.max(1, total)) * 100);
    }

    function competitorTopModelForBrand(shop, brand) {
      if (brand === 'SS') return shop.samsung.models[0]?.model || '—';
      const pin = shop.competitor.pins.find(item => item.comp.toUpperCase().startsWith(brand) || (brand === 'SN' && item.comp.toUpperCase().startsWith('SN')));
      if (pin) return pin.comp;
      const fallback = {
        LG: 'LG OLED65B5',
        TCL: 'TCL 55C755',
        SN: 'SN XR65A95L',
        HISEN: 'Hisense U7N 65',
        TOS: 'Toshiba C350 55',
        OTHERS: 'Mixed low-end'
      };
      return fallback[brand] || '—';
    }

    function driverDeltaValue(brand, metric, ihsDelta = 0) {
      const patterns = {
        hc: { SS: 0, LG: 0, TCL: 1, SN: 0, HISEN: 1, TOS: 0, OTHERS: 0 },
        display: { SS: -1, LG: 1, TCL: 2, SN: 0, HISEN: 1, TOS: 0, OTHERS: 0 }
      };
      if (metric === 'ihs') return ihsDelta;
      return (patterns[metric] || {})[brand] ?? 0;
    }

    function compactDeltaText(value, unit = '') {
      const num = Number(value) || 0;
      if (num === 0) return `0${unit ? ' ' + unit : ''}`;
      return `${signedText(num)}${unit ? ' ' + unit : ''}`;
    }

    function renderCompactDriverCell(value, ratio, delta, unit = '') {
      const tone = competitorDeltaTone(delta);
      const ratioText = ratio ? `${ratio} · ` : '';
      return `<strong>${value}</strong><small class="delta-${tone}">${ratioText}${compactDeltaText(delta, unit)}</small>`;
    }

    function renderCompetitorDriverTable(shop) {
      const activeBrand = activeCompetitorBrand(shop);
      const peopleTotal = competitorPeopleTotal(shop);
      const displayTotal = competitorDisplayTotal(shop);
      const rows = shop.competitor.shares.map((item, index) => {
        const brand = item.brand;
        const ihsDelta = competitorDelta(item, index);
        const hc = competitorPeopleForBrand(shop, brand);
        const bay = competitorDisplayBays(shop, brand);
        return {
          ...item,
          brand,
          selloutPct: Number(item.share) || 0,
          peoplePct: pct(hc, peopleTotal),
          displayPct: pct(bay, displayTotal),
          ihsDelta,
          hcDelta: driverDeltaValue(brand, 'hc', ihsDelta),
          displayDelta: driverDeltaValue(brand, 'display', ihsDelta)
        };
      });

      const selloutHeat = driverHeatLookup(rows, row => row.selloutPct);
      const peopleHeat = driverHeatLookup(rows, row => row.peoplePct);
      const displayHeat = driverHeatLookup(rows, row => row.displayPct);

      const body = rows.map((row, index) => {
        const isActive = row.brand === activeBrand;
        const activeClass = isActive ? ' row-active' : '';
        const actionAttrs = row.brand === 'OTHERS' ? '' : `data-action="competitor-brand" data-brand="${row.brand}"`;
        return `${renderDriverBrandCell(row, index, activeClass, actionAttrs)}
          ${renderDriverMetricCell(row, 'sellout', row.selloutPct, row.ihsDelta, selloutHeat.get(row.brand), activeClass, actionAttrs)}
          ${renderDriverMetricCell(row, 'people', row.peoplePct, row.hcDelta, peopleHeat.get(row.brand), activeClass, actionAttrs)}
          ${renderDriverMetricCell(row, 'display', row.displayPct, row.displayDelta, displayHeat.get(row.brand), activeClass, actionAttrs)}`;
      }).join('');

      return `<div class="driver-shape-wrap">
        <div class="driver-shape-grid" aria-label="Driver đối thủ theo contribution">
          <div class="driver-shape-head">Brand</div><div class="driver-shape-head metric-head">Sellout</div><div class="driver-shape-head metric-head">Nhân sự</div><div class="driver-shape-head metric-head">Display</div>
          ${body}
        </div>
      </div>
      <div class="driver-table-note"><strong>Màu ngang theo brand</strong> lấy từ treemap; từng ô là shape bo góc, độ đậm được normalize theo từng cột dọc.</div>`;
    }

    function pinSegmentLabel(key) {
      if (key === 'all') return 'All segment';
      return pinSegmentOptions.find(item => item.key === key)?.label || key;
    }

    function pinLULabel(key) {
      if (key === 'all') return 'All LU';
      return pinLUOptions.find(item => item.key === key)?.label || key;
    }

    function pinRowsByFilter(shop) {
      return pinThreatRows(shop).filter(row => {
        const matchSegment = state.pinSegment === 'all' || row.segment === state.pinSegment;
        const matchLU = state.pinLU === 'all' || row.lu === state.pinLU;
        return matchSegment && matchLU;
      }).sort((a, b) => {
        const aTop = a.threats[0]?.delta ?? -999;
        const bTop = b.threats[0]?.delta ?? -999;
        return bTop - aTop;
      });
    }

    function countPinRows(shop, kind, key) {
      const rows = pinThreatRows(shop);
      if (key === 'all') return rows.length;
      return rows.filter(row => row[kind] === key).length;
    }

    function allFilteredThreats(shop) {
      return pinRowsByFilter(shop).flatMap(row => row.threats.map(threat => ({ ...threat, ss: row.ss, ssIhs: row.ssIhs, segment: row.segment, lu: row.lu })));
    }

    function pinDeltaLabel(delta) {
      const value = Number(delta) || 0;
      if (value > 0) return `+${value} pts`;
      if (value < 0) return `SS +${Math.abs(value)} pts`;
      return 'Tie';
    }

    function pinStandingClass(delta) {
      const value = Number(delta) || 0;
      if (value > 0) return 'ahead';
      if (value < 0) return 'ss-ahead';
      return 'tie';
    }

      return `<div class="pin-filter-panel pin-filter-panel--compact" aria-label="Lọc pin-to-pin theo segment và LU">

          </div>
        </div>
      </div>`;
    }

    function renderPinThreatCard(threat, index, row) {
      const delta = Number(threat.delta) || 0;
      const standing = pinStandingClass(delta);
      const topClass = index === 0 ? ' top-threat' : '';
      const compWidth = Math.min(100, Math.max(4, Number(threat.ihs) || 0));
      const ssWidth = Math.min(100, Math.max(4, Number(row.ssIhs) || 0));
      return `<div class="pin-threat-card${topClass} ${standing}">
        <div class="pin-threat-main">
          <div class="pin-threat-brandline"><strong>${threat.brand}</strong><span>${threat.model}</span></div>
          <div class="pin-mini-bars" aria-label="Chênh lệch ${pinDeltaLabel(delta)}">
            <span class="pin-comp-bar" style="width:${compWidth}%"></span>
            <span class="pin-ss-bar" style="width:${ssWidth}%"></span>
          </div>
        </div>
        <div class="pin-threat-score"><strong>${pinDeltaLabel(delta)}</strong><small>${delta > 0 ? 'hơn SS' : delta < 0 ? 'SS hơn' : 'ngang'}</small></div>
      </div>`;
    }

    function renderPinModelBattle(row) {
      const shortlist = row.threats.slice(0, 3);

    function renderCompetitorStoreInsight(shop) {
      const rows = shop.competitor.shares.filter(item => item.brand !== 'OTHERS')
        .map((item, index) => ({ ...item, activeDelta: competitorDelta(item, index) }));
      const ss = rows.find(item => item.brand === 'SS') || rows[0];
      const rivals = rows.filter(item => item.brand !== 'SS');
      const topGrower = [...rivals].sort((a, b) => (b.activeDelta - a.activeDelta) || (b.share - a.share))[0] || rivals[0] || ss;
      const topShare = [...rivals].sort((a, b) => b.share - a.share)[0] || topGrower;
      const focus = topGrower.activeDelta > 0 ? topGrower : topShare;
      const ssDelta = Number(ss?.activeDelta || 0);
      const focusDelta = Number(focus?.activeDelta || 0);
      const ssTone = competitorDeltaTone(ssDelta);
      const focusTone = competitorDeltaTone(focusDelta);
      const peopleShare = pct(competitorPeopleForBrand(shop, focus.brand), competitorPeopleTotal(shop));
      const displayShare = pct(competitorDisplayBays(shop, focus.brand), competitorDisplayTotal(shop));
      const ssLead = ssDelta < 0
        ? `SS giảm ${signedText(ssDelta)} pts tại shop; ưu tiên kiểm tra brand đối thủ đang kéo share ngay trong bảng driver.`

      const focusLead = focusDelta > 0
        ? `${competitorBrandLabel(focus.brand)} là brand tăng đáng chú ý nhất tại cửa hàng này.`

      return `<section class="detail-section competitor-store-section competitor-section">

            <div class="expansion-score"><small>Brand cần soi</small><strong>${competitorBrandLabel(focus.brand)}</strong></div>
            <div class="expansion-score"><small>Biến động</small><strong class="delta-${focusTone}">${signedText(focusDelta)} pts</strong></div>
          </div>
          <div class="competitor-lift-grid">
            <div class="lift-mini"><small>IHS đối thủ</small><strong>${focus.share}%</strong></div>
            <div class="lift-mini"><small>Nhân sự tại shop</small><strong>${peopleShare}%</strong></div>

      </section>`;

    function closeSheet() {
      $('#backdrop').classList.remove('show');
      $('#sheet').classList.remove('show');
    }

    let toastTimer;
    function toast(message) {
      const el = $('#toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }


    const quickNavSelectors = {
      sales: '.sales-section',
      display: '.display-section',
      people: '.people-section',
      competitor: '.competitor-driver-section',
      pintoPin: '.pin-to-pin-section'
    };

    function updateDetailQuickNav() {
      const nav = $('#detailQuickNav');
      const content = $('#content');
      if (!nav || !content) return;
      const inDetail = state.tab === 'shops' && state.mode === 'detail';
      const shouldShow = inDetail && content.scrollTop > 185;
      nav.classList.toggle('show', shouldShow);
      nav.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');

      const buttons = nav.querySelectorAll('[data-quick]');
      buttons.forEach(button => button.classList.remove('active'));
      if (!shouldShow) return;

      let activeKey = 'sales';
      const contentRect = content.getBoundingClientRect();
      ['sales', 'display', 'people', 'competitor', 'pintoPin'].forEach(key => {
        const el = document.querySelector(quickNavSelectors[key]);
        if (!el) return;
        const top = el.getBoundingClientRect().top - contentRect.top;
        if (top <= 78) activeKey = key;
      });
      const activeButton = nav.querySelector(`[data-quick="${activeKey}"]`);
      if (activeButton) activeButton.classList.add('active');
    }

    function scrollToDetailTarget(key) {
      const content = $('#content');
      const selector = quickNavSelectors[key];
      if (!content || !selector) return;
      requestAnimationFrame(() => {
        const el = document.querySelector(selector);
        if (!el) return;
        const contentRect = content.getBoundingClientRect();
        const top = content.scrollTop + el.getBoundingClientRect().top - contentRect.top - 8;
        content.scrollTo({ top, behavior: 'smooth' });
        updateDetailQuickNav();
      });
    }

    function handleQuickJump(key) {
      if (state.mode !== 'detail') return;
      scrollToDetailTarget(key);
    }


    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.dataset.view === tab));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.tab === tab));
      const title = $('#screenTitle');
      if (title) title.textContent = titleMap[tab] || 'Shop Listing';
      $('#content').scrollTop = 0;
      if (tab !== 'shops') state.mode = 'listing';
      if (tab === 'shops') renderShopPage();
      updateDetailQuickNav();
    }

    document.addEventListener('click', (event) => {
      const tabTarget = event.target.closest('[data-tab]');
      if (tabTarget) {
        switchTab(tabTarget.dataset.tab);
        return;
      }

      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'filter') {
        state.mode = 'listing';
        state.filter = target.dataset.filter;
        state.visibleLimit = SHOP_PAGE_SIZE;
        renderShopPage();
        $('#content').scrollTop = 0;
        return;
      }
      if (action === 'open-usecase-guide') {
        openUsecaseGuide();
        return;
      }
      if (action === 'guide-filter') {
        state.filter = target.dataset.filter;
        state.visibleLimit = SHOP_PAGE_SIZE;
        closeSheet();
        renderShopPage();
        $('#content').scrollTop = 0;
        toast(`${filterMap[state.filter]} filter`);
        return;
      }
      if (action === 'open-shop-detail') {
        state.selectedShopId = target.dataset.shop;
        state.detailShopId = target.dataset.shop;
        state.detailTab = 'samsung';
        state.competitorCompare = 'lw';
        state.competitorBrand = '';
        state.pinSegment = 'all';
        state.pinLU = 'all';
        state.displayExpanded = false;
        state.staffExpanded = false;
        state.mode = 'detail';
        renderShopPage();
        $('#content').scrollTop = 0;
        updateDetailQuickNav();
        return;
      }
      if (action === 'detail-back') {
        state.mode = 'listing';
        renderShopPage();
        $('#content').scrollTop = 0;
        return;
      }
      if (action === 'quick-jump') {
        handleQuickJump(target.dataset.quick);
        return;
      }
      if (action === 'competitor-brand') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        const isTreemapCell = !!target.closest('.treemap-map');
        const isDoubleClick = isTreemapCell && event.detail >= 2;
        state.competitorBrand = isDoubleClick ? '' : (target.dataset.brand || '');
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        return;
      }
      if (action === 'competitor-compare') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.competitorCompare = target.dataset.compare || 'lw';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        return;
      }
      if (action === 'pin-segment') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinSegment = target.dataset.segment || 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'pin-lu') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinLU = target.dataset.lu || 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'pin-reset') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinSegment = 'all';
        state.pinLU = 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'detail-tab') {
        state.detailTab = target.dataset.detailTab;
        renderShopPage();
        $('#content').scrollTop = 0;
        updateDetailQuickNav();
        return;
      }
      if (action === 'show-more-display') {
        state.displayExpanded = true;
        renderShopPage();
        return;
      }
      if (action === 'show-more-staff') {
        state.staffExpanded = true;
        renderShopPage();
        return;
      }
      if (action === 'open-staff-calendar') {
        openStaffCalendar(target.dataset.staff);
        return;
      }
      if (action === 'load-more') {
        state.visibleLimit += SHOP_PAGE_SIZE;
        renderShopPage();
        return;
      }
      if (action === 'close-sheet') {
        closeSheet();
        return;
      }

    });

    document.addEventListener('input', (event) => {
      if (!event.target.matches('[data-shop-search]')) return;
      state.shopSearch = event.target.value;
      state.visibleLimit = SHOP_PAGE_SIZE;
      renderShopPage();
      const input = $('[data-shop-search]');
      if (input) {
        input.focus();
        const pos = input.value.length;
        input.setSelectionRange(pos, pos);
      }
    });

    function competitorSquareBrandLogo(brand) {
      return competitorSquareLogoAssets[normalizeCompetitorBrand(brand)] || '';
    }

    function hexToRgbTriplet(hex) {
      const clean = String(hex || '').replace('#', '').trim();
      if (clean.length === 3) {
        const r = parseInt(clean[0] + clean[0], 16);
        const g = parseInt(clean[1] + clean[1], 16);
        const b = parseInt(clean[2] + clean[2], 16);
        return `${r}, ${g}, ${b}`;
      }
      const value = parseInt(clean, 16);
      if (!Number.isFinite(value)) return '20, 40, 160';
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return `${r}, ${g}, ${b}`;
    }

    function driverCellVars(brand, heat = .5) {
      const colors = competitorTreemapStyle(brand);
      const safeHeat = Math.max(0, Math.min(1, Number(heat) || 0));
      const hi = (0.16 + safeHeat * 0.48).toFixed(2);
      const lo = (0.06 + safeHeat * 0.22).toFixed(2);
      return `--brand-border:${colors.border};--brand-fill:${colors.fill};--brand-text:${colors.text};--brand-rgb:${hexToRgbTriplet(colors.border)};--heat-hi:${hi};--heat-lo:${lo};`;
    }


    function driverMetricCellVars(metricKey, heat = .5) {
      const palette = {
        sellout: '#2563EB',
        people: '#7C3AED',
        display: '#0D9488'
      };
      const safeHeat = Math.max(0, Math.min(1, Number(heat) || 0));
      const hi = (0.14 + safeHeat * 0.56).toFixed(2);
      const lo = (0.055 + safeHeat * 0.26).toFixed(2);
      return `--metric-rgb:${hexToRgbTriplet(palette[metricKey] || '#2563EB')};--heat-hi:${hi};--heat-lo:${lo};`;
    }

    function driverHeatLookup(rows, getter) {
      const values = rows.map(row => Number(getter(row)) || 0);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(0.0001, max - min);
      return new Map(rows.map(row => {
        const raw = Number(getter(row)) || 0;
        const normalized = max === min ? .5 : (raw - min) / span;
        return [row.brand, normalized];
      }));
    }

    function driverPercentText(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '0%';
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function driverDeltaPctText(value) {
      const num = Number(value) || 0;
      if (num === 0) return '0%';
      return `${signedText(num)}%`;
    }

    function driverDeltaSmall(delta) {
      const tone = competitorDeltaTone(delta);
      return `<small class="delta-${tone}">${driverDeltaPctText(delta)}</small>`;
    }

    function driverLogoHtml(brand) {
      const src = competitorBrandLogo(brand);
      if (src) return `<span class="driver-logo-box"><img src="${src}" alt="${competitorBrandLabel(brand)} logo" loading="lazy"></span>`;
      return `<span class="driver-logo-box"><span class="driver-logo-fallback">${competitorBrandLabel(brand)}</span></span>`;
    }


    function modelRankLogoHtml(brand) {
      const src = competitorSquareBrandLogo(brand);
      if (src) return `<span class="model-rank-logo-box"><img src="${src}" alt="${competitorBrandLabel(brand)} logo" loading="lazy"></span>`;
      return driverLogoHtml(brand);
    }

    function renderDriverBrandCell(row, index, activeClass, actionAttrs) {
      return `<div class="driver-shape-cell driver-shape-brand${activeClass}" data-brand="${row.brand}" ${actionAttrs} style="${driverCellVars(row.brand, .36)}">
        ${driverLogoHtml(row.brand)}
      </div>`;
    }

    function renderDriverMetricCell(row, metricKey, value, delta, heat, activeClass, actionAttrs, isLeader = false) {
      const leaderClass = isLeader ? ' driver-leader' : '';
      return `<div class="driver-shape-cell driver-shape-metric driver-${metricKey}-cell${leaderClass}${activeClass}" ${actionAttrs} style="${driverMetricCellVars(metricKey, heat)}">
        <strong>${driverPercentText(value)}</strong>
        ${driverDeltaSmall(delta)}
      </div>`;
    }

    function renderDriverModelCell(row, activeClass, actionAttrs) {
      return `<div class="driver-model-cell${activeClass}" ${actionAttrs} style="${driverCellVars(row.brand, .22)}">
        <strong class="driver-top-model-name">${row.topModel}</strong>
        <small>Top model</small>
      </div>`;
    }

    function renderCompetitorDriverTable(shop) {
      const activeBrand = activeCompetitorBrand(shop);
      const peopleTotal = competitorPeopleTotal(shop);
      const displayTotal = competitorDisplayTotal(shop);
      const rows = shop.competitor.shares.map((item, index) => {
        const brand = item.brand;
        const ihsDelta = competitorDelta(item, index);
        const hc = competitorPeopleForBrand(shop, brand);
        const bay = competitorDisplayBays(shop, brand);
        return {
          ...item,
          brand,
          selloutPct: Number(item.share) || 0,
          peoplePct: pct(hc, peopleTotal),
          displayPct: pct(bay, displayTotal),
          ihsDelta,
          hcDelta: driverDeltaValue(brand, 'hc', ihsDelta),
          displayDelta: driverDeltaValue(brand, 'display', ihsDelta)
        };
      });

      const selloutHeat = driverHeatLookup(rows, row => row.selloutPct);
      const peopleHeat = driverHeatLookup(rows, row => row.peoplePct);
      const displayHeat = driverHeatLookup(rows, row => row.displayPct);
      const maxByMetric = {
        sellout: Math.max(...rows.map(row => row.selloutPct)),
        people: Math.max(...rows.map(row => row.peoplePct)),
        display: Math.max(...rows.map(row => row.displayPct))
      };

      const body = rows.map((row, index) => {
        const isActive = row.brand === activeBrand;
        const activeClass = isActive ? ' row-active' : '';
        const actionAttrs = row.brand === 'OTHERS' ? '' : `data-action="competitor-brand" data-brand="${row.brand}"`;
        return `${renderDriverBrandCell(row, index, activeClass, actionAttrs)}
          ${renderDriverMetricCell(row, 'sellout', row.selloutPct, row.ihsDelta, selloutHeat.get(row.brand), activeClass, actionAttrs, row.selloutPct === maxByMetric.sellout)}
          ${renderDriverMetricCell(row, 'people', row.peoplePct, row.hcDelta, peopleHeat.get(row.brand), activeClass, actionAttrs, row.peoplePct === maxByMetric.people)}
          ${renderDriverMetricCell(row, 'display', row.displayPct, row.displayDelta, displayHeat.get(row.brand), activeClass, actionAttrs, row.displayPct === maxByMetric.display)}`;
      }).join('');

      return `<div class="driver-shape-wrap">
        <div class="driver-shape-grid driver-shape-grid--no-model" aria-label="Driver đối thủ theo contribution">
          <div class="driver-shape-head driver-brand-head">Brand</div><div class="driver-shape-head metric-head" data-metric="sellout">Sellout</div><div class="driver-shape-head metric-head" data-metric="people">Nhân sự</div><div class="driver-shape-head metric-head" data-metric="display">Display</div>
          ${body}
        </div>
      </div>`;
    }

    function normalizeCompetitorBrand(brand) {
      const raw = String(brand || '').trim().toUpperCase();
      if (!raw) return 'OTHERS';
      if (raw === 'SAMSUNG' || raw === 'SS') return 'SS';
      if (raw === 'SONY' || raw === 'SN') return 'SN';
      if (raw === 'HISENSE' || raw === 'HISEN') return 'HISEN';
      if (raw === 'TOSHIBA' || raw === 'TOS') return 'TOS';
      if (raw.startsWith('LG')) return 'LG';
      if (raw.startsWith('TCL')) return 'TCL';
      return raw;
    }

    function modelGrowthSeed(text) {
      return String(text || '').split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
    }

    function parseTrendPercent(value) {
      const match = String(value || '').match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : 0;
    }

    function competitorShareDeltaForBrand(shop, brand) {
      const normalized = normalizeCompetitorBrand(brand);
      const index = shop.competitor.shares.findIndex(item => normalizeCompetitorBrand(item.brand) === normalized);
      if (index < 0) return 0;
      return competitorDelta(shop.competitor.shares[index], index);
    }

    function inferredModelGrowth(shop, brand, model, sellout, fallback = 0) {
      const delta = competitorShareDeltaForBrand(shop, brand);
      const seed = modelGrowthSeed(model);
      const noise = ((seed % 9) - 3) * 2;
      const sizeBoost = Number(sellout) >= 55 ? 5 : Number(sellout) >= 25 ? 2 : 0;
      const value = fallback || Math.round(delta * 22 + noise + sizeBoost);
      return Math.max(-35, Math.min(130, value));
    }

    function topCompetitorModels(shop) {
      const modelMap = new Map();
      const add = (entry) => {
        if (!entry || !entry.model) return;
        const brand = normalizeCompetitorBrand(entry.brand);
        const model = String(entry.model).trim();
        const key = `${brand}|${model}`;
        const current = modelMap.get(key);
        const sellout = Math.max(0, Math.round(Number(entry.sellout) || 0));
        const growth = Number.isFinite(Number(entry.growth)) ? Math.round(Number(entry.growth)) : inferredModelGrowth(shop, brand, model, sellout);
        const next = { brand, model, sellout, growth };
        if (!current || sellout > current.sellout || growth > current.growth) modelMap.set(key, { ...current, ...next, sellout: Math.max(sellout, current?.sellout || 0), growth: Math.max(growth, current?.growth ?? -999) });
      };

      (shop.samsung.models || []).forEach((item) => {
        add({ brand: 'SS', model: item.model, sellout: item.qty || 0, growth: parseTrendPercent(item.trend) });
      });

      pinThreatRows(shop).forEach((row) => {
        add({ brand: 'SS', model: row.ss, sellout: row.ssIhs, growth: inferredModelGrowth(shop, 'SS', row.ss, row.ssIhs, shop.ihsDelta * 8) });
        row.threats.forEach((threat) => {
          add({ brand: threat.brand, model: threat.model, sellout: threat.ihs, growth: inferredModelGrowth(shop, threat.brand, threat.model, threat.ihs) });
        });
      });

      return Array.from(modelMap.values());
    }

    function rankValueLabel(metric, item) {
      if (!item) return '';
      if (metric === 'growth') {
        const sign = item.growth > 0 ? '+' : '';
        return `${sign}${item.growth}% G.R`;
      }
      return `${item.sellout} sp`;
    }

    function renderModelRankingRow(item, metric) {
      if (!item) return `<div class="competitor-model-rank-row empty-row"><span></span><div class="model-rank-copy"><strong>—</strong><small>Chưa có data</small></div></div>`;
      return `<div class="competitor-model-rank-row" title="${competitorBrandLabel(item.brand)} • ${item.model}">
        <span class="model-rank-brand" data-brand="${item.brand}">${modelRankLogoHtml(item.brand)}</span>
        <div class="model-rank-copy"><strong>${item.model}</strong><small>${rankValueLabel(metric, item)}</small></div>
      </div>`;
    }

    function renderCompetitorModelRanking(shop) {
      const source = topCompetitorModels(shop);
      const selloutRows = [...source].sort((a, b) => b.sellout - a.sellout || b.growth - a.growth).slice(0, 10);
      const growthRows = [...source].sort((a, b) => b.growth - a.growth || b.sellout - a.sellout).slice(0, 10);
      const ranks = Array.from({ length: 10 }, (_, index) => index + 1);
      return `<section class="detail-section competitor-rank-section competitor-section">
        <div class="detail-section-head"><div><h3>Top model đối thủ</h3><small>Xếp hạng theo Sellout và % Grow rate Sellout tại shop.</small></div><span class="section-badge">Top 10</span></div>
        <div class="competitor-rank-layout" aria-label="Bảng xếp hạng model theo sellout và grow rate sellout">
          <div class="competitor-rank-rail" aria-hidden="true">
            <div class="rank-rail-head">Rank</div>
            ${ranks.map(rank => `<span class="rank-rail-cell top-${rank}">${rank}</span>`).join('')}
          </div>
          <div class="competitor-rank-tube sellout">
            <div class="rank-tube-head"><div><strong>Sellout</strong><small>Top SO model</small></div><span class="rank-head-chip">SO</span></div>
            ${ranks.map((rank, index) => renderModelRankingRow(selloutRows[index], 'sellout')).join('')}
          </div>
          <div class="competitor-rank-tube growth">
            <div class="rank-tube-head"><div><strong>Grow rate</strong><small>% G.R Sellout</small></div><span class="rank-head-chip">G.R</span></div>
            ${ranks.map((rank, index) => renderModelRankingRow(growthRows[index], 'growth')).join('')}
          </div>
        </div>
      </section>`;
    }

    function renderCompetitorDetail(shop) {
      const promo = shop.competitor.promotion;
      return `
        <section class="detail-section competitor-driver-section competitor-section">
          <div class="detail-section-head"><div><h3>Bảng driver đối thủ</h3><small>3 driver: Sellout, Nhân sự, Display đều là % contribution.</small></div></div>
          ${renderCompetitorDriverTable(shop)}
        </section>
        ${renderCompetitorModelRanking(shop)}
        <section class="detail-section pin-to-pin-section">
          <div class="detail-section-head"><div><h3>Pin-to-pin IHS shortlist</h3><small>Lọc nhanh theo Segment / LU để xem shortlist model đang thắng hoặc bị vượt.</small></div></div>
          ${renderPinList(shop)}
        </section>
        <div class="competitor-pressure">
          <strong>Promotion / price pressure tác động sellout</strong>
          <p>${promo.pressure}. ${promo.priceImpact}. Display: ${promo.display}.</p>
        </div>`;
    }


    const detailContent = $('#content');
    if (detailContent) detailContent.addEventListener('scroll', updateDetailQuickNav, { passive: true });

    switchTab('shops');
  </script>
</body>
</html>
