<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Field App - Shop Detail Demo Store Profile Staffing v28 Pin-to-pin Single Table</title>
  <!-- build: detail-demo-sales-v1-v31-pin-header-fill-body-light -->
  <!-- tweak: Home Weekly Ach Clock labels outside + old label colors restored + no marker/dot + pie unchanged; gap positive green card + compact heat legend tight/small above days; calendar block pulled up via margin; W1=10%, W2=55%, W3=72%, W4=92%; default focus Week 4 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --samsung-blue: #1428A0;
      --blue-500: #2B5CFF;
      --blue-soft: #EEF3FF;
      --ink: #0B0B0F;
      --text: #111111;
      --muted: #6B7280;
      --subtle: #9CA3AF;
      --surface: #F4F6FA;
      --card: #FFFFFF;
      --line: rgba(0,0,0,.07);
      --warning: #F59E0B;
      --danger: #D92D20;
      --success: #18A058;
      --purple: #7C3AED;
      --shadow-soft: 0 16px 45px rgba(0,0,0,.08);
      --shadow-float: 0 24px 70px rgba(10,22,70,.16);
      --font: "Be Vietnam Pro", Inter, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 75% 8%, rgba(20,40,160,.18), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #eef2f7 100%);
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .phone {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      border-radius: 42px;
      background:
        radial-gradient(circle at 86% 4%, rgba(20,40,160,.13), transparent 25%),
        linear-gradient(180deg, #FFFFFF 0%, #F4F6FA 82%);
      box-shadow: var(--shadow-float);
      border: 10px solid #0D0D10;
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      border-radius: 999px;
      background: #0D0D10;
      z-index: 40;
    }

    .screen {
      height: 100%;
      padding: 22px 18px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -.02em;
      flex: 0 0 auto;
    }

    .signal { display: flex; align-items: center; gap: 5px; color: #111; }
    .battery { width: 24px; height: 12px; border: 1.7px solid #111; border-radius: 4px; position: relative; }
    .battery::before { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: #111; border-radius: 2px; }
    .battery::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 6px; border-radius: 2px; background: #111; }

    .app-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      flex: 0 0 auto;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 16px;
      background: #000;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.04em;
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
    }

    .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-bottom: 2px; }
    .brand strong { display: block; font-size: 20px; letter-spacing: -.055em; line-height: 1; }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 70% 20%, rgba(0,212,255,.55), transparent 30%),
        linear-gradient(135deg, var(--samsung-blue), var(--blue-500));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      border: 0;
      box-shadow: 0 12px 26px rgba(20,40,160,.25);
    }

    .content {
      margin-top: 14px;
      padding-bottom: 84px;
      overflow: auto;
      scrollbar-width: none;
      flex: 1 1 auto;
    }
    .content::-webkit-scrollbar { display: none; }

    .shop-page-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .guide-button {
      min-height: 74px;
      border: 0;
      border-radius: 26px;
      text-align: left;
      padding: 14px 15px;
      color: #fff;
      background:
        radial-gradient(circle at 92% 0%, rgba(0,212,255,.25), transparent 35%),
        linear-gradient(135deg, #0B0B0F 0%, #17235D 100%);
      box-shadow: 0 16px 34px rgba(20,40,160,.18);
      transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s;
    }
    .guide-button:active, .filter-chip:active, .shop-card:active { transform: scale(.985); }
    .guide-button strong { display: flex; align-items: center; gap: 7px; font-size: 14px; letter-spacing: -.04em; }
    .guide-button small { display: block; margin-top: 5px; color: rgba(255,255,255,.72); font-size: 11px; font-weight: 500; line-height: 1.28; }
    .guide-spark { width: 22px; height: 22px; border-radius: 10px; display: inline-grid; place-items: center; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.13); }

    .shop-page-counter {
      width: 76px;
      border-radius: 26px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.055);
      box-shadow: 0 8px 24px rgba(0,0,0,.055);
      display: grid;
      place-items: center;
      text-align: center;
    }
    .shop-page-counter strong { display: block; font-size: 25px; letter-spacing: -.08em; color: var(--samsung-blue); }
    .shop-page-counter small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; font-weight: 600; }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
      margin: 14px 0 10px;
      padding-bottom: 2px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: #333;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 7px 18px rgba(0,0,0,.035);
      transition: transform .16s cubic-bezier(.2,.8,.2,1), background .16s, color .16s;
    }
    .filter-chip.active { background: #000; color: #fff; border-color: #000; }
    .filter-chip span { opacity: .62; font-size: 11px; }

    .shop-search-wrap {
      height: 48px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.045);
    }
    .shop-search-wrap svg { width: 17px; height: 17px; color: var(--subtle); flex: 0 0 auto; stroke-width: 2.4; }
    .shop-search-wrap input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }
    .shop-search-wrap input::placeholder { color: var(--subtle); font-weight: 500; }

    .shop-list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 2px 10px;
    }
    .shop-list-head h2 { margin: 0; font-size: 17px; letter-spacing: -.045em; }
    .shop-list-head span { font-size: 12px; color: var(--muted); font-weight: 600; }

    .shop-list { display: grid; gap: 14px; }

    .shop-card {
      width: 100%;
      border: 1px solid rgba(0,0,0,.055);
      border-radius: 30px;
      background: #fff;
      padding: 14px;
      text-align: left;
      box-shadow: 0 12px 30px rgba(0,0,0,.065);
      overflow: hidden;
      transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s, border-color .16s;
    }
    .shop-card.selected { border-color: rgba(20,40,160,.26); box-shadow: 0 14px 32px rgba(20,40,160,.10); }
    .shop-card-top {
      display: grid;
      grid-template-columns: 124px 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .shop-photo {
      height: 132px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(12,18,40,.86), rgba(20,40,160,.70)),
        radial-gradient(circle at 82% 18%, rgba(0,212,255,.65), transparent 28%),
        linear-gradient(90deg, #20243A 0 28%, #30364D 28% 32%, #0E1430 32% 68%, #3A4055 68% 72%, #1C2136 72% 100%);
    }
    .shop-photo::before {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      top: 18px;
      height: 44px;
      border-radius: 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
    }
    .photo-sign {
      position: absolute;
      left: 20px;
      top: 32px;
      color: #fff;
      letter-spacing: .15em;
      font-size: 10px;
      font-weight: 600;
    }
    .photo-meta {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 13px;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 500;
    }

    .shop-ref-info { min-width: 0; padding-top: 2px; }
    .shop-ref-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .grade-status-pill {
      min-height: 29px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-radius: 999px;
      background: #F1F3F5;
      color: #111;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .grade-status-pill i {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #49C78A;
      box-shadow: 0 0 0 4px rgba(73,199,138,.12);
    }

    .usecase-dots { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .case-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; box-shadow: 0 0 0 4px rgba(20,40,160,.06); }
    .case-dot.red { background: var(--danger); }
    .case-dot.orange { background: var(--warning); }
    .case-dot.blue { background: var(--blue-500); }
    .case-dot.purple { background: var(--purple); }
    .case-dot.yellow { background: #FACC15; }
    .case-more { height: 22px; min-width: 26px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: #111; color: #fff; font-size: 10px; font-weight: 500; }

    .shop-ref-name {
      color: #0B0B0F;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: 1.05;
      margin-bottom: 5px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .shop-ref-subtitle { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.25; margin-bottom: 10px; }
    .shop-ref-signal {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 9px;
      white-space: nowrap;
    }
    .shop-ref-signal .star { color: #FF8B6B; font-size: 16px; line-height: 1; }
    .shop-ref-signal strong { color: #FF8B6B; font-size: 13px; letter-spacing: -.025em; }
    .bullet { color: #9CA3AF; }
    .shop-ref-focus {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6B7FC8;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.1;
    }
    .shop-ref-focus span {
      width: 20px;
      height: 20px;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: #6B7FC8;
      font-size: 11px;
    }

    .shop-location-strip {
      min-height: 52px;
      border-radius: 18px;
      background: #F1F2F6;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px 11px;
      margin-top: 13px;
      color: #111;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }
    .loc-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .loc-icon svg { width: 18px; height: 18px; stroke-width: 2.4; }
    .strip-arrow {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      font-size: 18px;
      font-weight: 500;
    }

    .shop-case-scroll {
      display: flex;
      gap: 8px;
      overflow: auto;
      scrollbar-width: none;
      margin-top: 12px;
      padding-bottom: 1px;
    }
    .shop-case-scroll::-webkit-scrollbar { display: none; }
    .shop-case-tile {
      flex: 0 0 94px;
      min-height: 68px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.07);
      background: #fff;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 9px 8px;
      text-align: center;
      box-shadow: 0 5px 14px rgba(0,0,0,.035);
    }
    .shop-case-tile.active { background: #F1F2F6; }
    .shop-case-tile small { display: block; color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.15; }
    .shop-case-tile strong { display: block; margin-top: 5px; color: #111; font-size: 14px; font-weight: 600; letter-spacing: -.045em; }

    .empty-state {
      border-radius: 24px;
      background: #fff;
      border: 1px dashed rgba(0,0,0,.15);
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
    }


    .view { display: none; animation: fadeUp .24s cubic-bezier(.2,.8,.2,1); }
    .view.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bottom-nav {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 14px;
      height: 68px;
      border-radius: 28px;
      background: rgba(255,255,255,.90);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(0,0,0,.065);
      box-shadow: 0 14px 36px rgba(0,0,0,.10);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px;
      z-index: 25;
    }
    .nav-item {
      border: 0;
      background: transparent;
      height: 52px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--subtle);
      font-size: 9px;
      font-weight: 500;
      padding: 4px 0;
    }
    .nav-item svg { width: 18px; height: 18px; stroke-width: 2.3; }
    .nav-item.active { background: var(--blue-soft); color: var(--samsung-blue); }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3,7,18,.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s;
      z-index: 28;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: #fff;
      border-radius: 34px 34px 0 0;
      padding: 12px 18px 22px;
      box-shadow: 0 -20px 60px rgba(0,0,0,.18);
      transform: translateY(106%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.show { transform: translateY(0); }
    .grabber { width: 44px; height: 5px; border-radius: 999px; background: #D7DCE5; margin: 0 auto 16px; }
    .sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .sheet-head h2 { margin: 0; font-size: 22px; letter-spacing: -.06em; }
    .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 500; }
    .close { width: 34px; height: 34px; border-radius: 999px; border: 0; background: #F1F3F5; color: #111; font-weight: 500; }
    .guide-list { display: grid; gap: 8px; }
    .guide-case-row {
      width: 100%;
      border: 1px solid rgba(0,0,0,.055);
      border-radius: 20px;
      background: #F7F8FC;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      text-align: left;
      align-items: center;
    }
    .guide-case-row strong { display: block; font-size: 13px; letter-spacing: -.035em; }
    .guide-case-row small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 3px; line-height: 1.3; }
    .guide-case-count { min-width: 36px; height: 36px; border-radius: 14px; display: grid; place-items: center; background: #fff; color: var(--samsung-blue); font-weight: 600; font-size: 13px; }
    .dark-card {
      margin-top: 11px;
      border-radius: 26px;
      padding: 15px;
      background:
        radial-gradient(circle at 95% 0%, rgba(0,212,255,.24), transparent 35%),
        linear-gradient(135deg, #0B0B0F 0%, #17235D 100%);
      color: #fff;
      box-shadow: 0 18px 34px rgba(20,40,160,.18);
    }
    .ai-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dark-card strong { font-size: 14px; letter-spacing: -.035em; }
    .dark-card p { margin: 0; color: rgba(255,255,255,.75); font-size: 12px; line-height: 1.45; font-weight: 500; }
    .spark { width: 32px; height: 32px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.12); }

    .toast {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      min-height: 46px;
      border-radius: 999px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9,12,20,.94);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      z-index: 50;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .22s, transform .22s;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateY(0); }



    /* Vietnamese typography tuning */
    h1, h2, h3,
    .brand strong,
    .guide-button strong,
    .shop-list-head h2,
    .shop-ref-name,
    .shop-case-tile strong,
    .sheet-head h2,
    .guide-case-row strong,
    .dark-card strong {
      letter-spacing: -.018em !important;
      line-height: 1.22 !important;
    }

    .statusbar,
    .logo-mark,
    .shop-page-counter strong,
    .shop-ref-signal strong,
    .photo-sign,
    .grade-status-pill,
    .case-more,
    .shop-ref-subtitle,
    .shop-location-strip,
    .shop-case-tile small,
    .guide-case-row small,
    button,
    input,
    small,
    p {
      letter-spacing: 0 !important;
    }

    /* Softer typography pass: reduce over-bold UI and keep Vietnamese marks airy */
    body { font-weight: 400; text-rendering: optimizeLegibility; }

    .brand strong,
    .shop-ref-name,
    .shop-list-head h2,
    .guide-button strong,
    .sheet-head h2,
    .dark-card strong,
    .guide-case-row strong {
      font-weight: 600 !important;
    }

    .photo-sign,
    .case-more,
    .guide-case-count,
    .shop-page-counter strong,
    .strip-arrow,
    .close {
      font-weight: 600 !important;
    }

    .brand small,
    .statusbar,
    .guide-button small,
    .filter-chip,
    .shop-search-wrap input,
    .shop-search-wrap input::placeholder,
    .shop-list-head span,
    .photo-meta,
    .shop-ref-subtitle,
    .shop-ref-signal,
    .shop-ref-focus,
    .shop-location-strip,
    .shop-case-tile small,
    .empty-state,
    .nav-item,
    .sheet-head p,
    .guide-case-row small,
    .toast {
      font-weight: 400 !important;
    }

    .grade-status-pill,
    .shop-case-tile strong,
    .shop-ref-signal strong,
    .avatar,
    .logo-mark,
    .shop-page-counter small {
      font-weight: 500 !important;
    }



    /* Final Vietnamese typography + balanced sizing pass */
    html, body, button, input {
      font-family: "Be Vietnam Pro", Arial, "Helvetica Neue", sans-serif !important;
      font-synthesis: none;
    }
    body {

        competitorIhsDrop: { value: 'Giảm 4%', severity: 4 }
      }
    };

    const $ = (sel) => document.querySelector(sel);

    function competitorGrowthPts(shop) {
      const competitors = shop.competitor.shares.filter(item => item.brand !== 'SS');
      return Math.max(0, ...competitors.map(item => item.delta || 0));
    }

    function isBelowTimeGone(shop) {
      return shop.ach < shop.timeGone;
    }

    function shopUsecases(shop) {
      const profiles = shopUsecaseProfiles[shop.id] || {};
      return guideSegments
        .filter(item => profiles[item.key])
        .map(item => ({
          key: item.key,
          label: item.label,
          tone: item.tone,
          value: profiles[item.key].value,
          severity: profiles[item.key].severity || 0
        }))
        .sort((a, b) => b.severity - a.severity);
    }

    function usecaseSeverity(shop, filter = state.filter) {
      const profiles = shopUsecaseProfiles[shop.id] || {};
      if (filter !== 'all') return profiles[filter]?.severity ?? -1;
      const values = Object.values(profiles).map(item => item.severity || 0);
      return values.length ? Math.max(...values) : -1;
    }

    function isIssueCountFilter(filter) {
      return ['issue2', 'issue3', 'issue3plus'].includes(filter);
    }

    function issueCountMatches(count, filter) {
      if (filter === 'issue2') return count === 2;
      if (filter === 'issue3') return count === 3;
      if (filter === 'issue3plus') return count > 3;
      return false;
    }

    function matchesUsecase(shop, filter = state.filter) {
      if (filter === 'all') return true;
      const cases = shopUsecases(shop);
      if (isIssueCountFilter(filter)) return issueCountMatches(cases.length, filter);
      return cases.some(item => item.key === filter);
    }

    function matchesSearch(shop) {
      const q = state.shopSearch.trim().toLowerCase();
      if (!q) return true;
      return [shop.name, shop.code, shop.region, shop.channel, shop.address].some(value => String(value).toLowerCase().includes(q));
    }

    function visibleShops() {
      return shops
        .filter(shop => matchesUsecase(shop) && matchesSearch(shop))
        .sort((a, b) => {
          const severityDiff = usecaseSeverity(b) - usecaseSeverity(a);
          if (severityDiff !== 0) return severityDiff;
          return (a.rank || 999) - (b.rank || 999);
        });
    }

    function countByFilter(filter) {
      return shops.filter(shop => matchesUsecase(shop, filter)).length;
    }

    function suggestedUsecases() {
      return guideSegments;
    }

    function usecaseValue(shop, item) {
      const profileValue = shopUsecaseProfiles[shop.id]?.[item.key]?.value;
      if (profileValue) return profileValue;

      const hcGap = shop.samsung.people.planned - shop.samsung.people.actual;
      const ihsDrop = Math.abs(Math.min(shop.ihsDelta || -4, -4));
      const productivityDrop = Math.max(2.5, Math.round(Math.abs(shop.ach - shop.timeGone) * 0.42 * 10) / 10);
      if (item.key === 'belowTimeGone') return `% Ach ${shop.ach}%`;
      if (item.key === 'peopleShort') return `+${Math.max(0, hcGap)} Headcount`;
      if (item.key === 'productivityDrop') return `Giảm ${productivityDrop} triệu`;
      if (item.key === 'competitorIhsDrop') return `Giảm ${ihsDrop}%`;
      return 'Check';
    }

    function filterTone(key) {
      const match = guideSegments.find(item => item.key === key);
      if (match) return match.tone;
      if (key === 'belowTimeGone') return 'red';
      if (key === 'peopleShort' || key === 'mcs') return 'blue';
      if (key === 'productivityDrop') return 'orange';
      if (key === 'competitorIhsDrop') return 'purple';
      if (key === 'display') return 'yellow';
      return 'blue';
    }

    function gradeStarCount(grade) {
      const value = String(grade || '').trim().toUpperCase();
      if (value.startsWith('A')) return 5;
      if (value.startsWith('B')) return 4;
      if (value.startsWith('C')) return 3;
      return 3;
    }

    function renderGradeRating(grade) {
      const filled = gradeStarCount(grade);
      const stars = Array.from({ length: 5 }, (_, index) => `<span class="${index < filled ? 'filled' : 'empty'}">★</span>`).join('');
      return `<span class="grade-rating" aria-label="Grade ${grade}, ${filled} sao"><span class="grade-stars">${stars}</span><span class="grade-text">Grade ${grade}</span></span>`;
    }

    function renderUsecaseDots(cases) {
      if (!cases.length) return '<span class="usecase-none">On track</span>';
      const maxDots = 6;
      const dots = cases.slice(0, maxDots).map(item => `<span class="case-dot ${item.tone}" title="${item.label}" aria-label="${item.label}"></span>`).join('');
      const more = cases.length > maxDots ? `<span class="case-more usecase-more">+${cases.length - maxDots}</span>` : '';
      return `<span class="usecase-inline-dots">${dots}${more}</span>`;
    }

    function renderUsecaseSummaryPill(cases) {
      if (!cases.length) {
        return `<span class="usecase-summary-pill on-track"><span class="usecase-mini-stack"><span class="usecase-mini-dot"></span></span><span>On track</span></span>`;
      }
      const dots = cases.slice(0, 3).map(item => `<span class="usecase-mini-dot ${item.tone}" title="${item.label}"></span>`).join('');
      const label = cases.length === 1 ? '1 issue' : `${cases.length} issues`;
      return `<span class="usecase-summary-pill"><span class="usecase-mini-stack">${dots}</span><span>${label}</span></span>`;
    }

    function activeUsecaseMetric(shop) {
      if (state.filter === 'all') return null;
      const cases = shopUsecases(shop);
      if (isIssueCountFilter(state.filter)) {
        return {
          tone: cases[0]?.tone || 'blue',
          text: `${cases.length} issue${cases.length > 1 ? 's' : ''}`
        };
      }
      const usecase = cases.find(item => item.key === state.filter) || { key: state.filter, label: filterMap[state.filter], tone: filterTone(state.filter) };
      return {
        tone: usecase.tone || filterTone(state.filter),
        text: usecaseValue(shop, usecase)
      };
    }

    const TOTAL_SHOP_BASE = 100;
    const SHOP_PAGE_SIZE = 10;

    function activeUsecaseSummary(displayedCount = 0) {

      const num = Number(value) || 0;
      return Math.max(0, Math.min(100, num));

    function achTone(ach) {
      if (ach < 72) return 'red';
      if (ach < 80) return 'orange';

    }

    function signedText(value) {
      const num = Number(value) || 0;
      if (num > 0) return `+${num}`;
      return String(num);
    }

    function trendTone(text) {
      return String(text || '').trim().startsWith('-') ? 'negative' : 'positive';
    }

    function strongestIssue(shop) {
      const cases = shopUsecases(shop);
      if (!cases.length) return { label: 'On track', tone: 'green', value: 'Ổn định' };
      return cases[0];
    }

    function samsungDiagnosis(shop) {
      const worstCategory = shop.samsung.categories.reduce((acc, item) => item.ach < acc.ach ? item : acc, shop.samsung.categories[0]);
      const worstSegment = shop.samsung.segments.reduce((acc, item) => item.ach < acc.ach ? item : acc, shop.samsung.segments[0]);
      const promoModel = shop.samsung.models.find(item => /promo|price|cashback|bundle|bonus|drop/i.test(item.promo)) || shop.samsung.models[0];
      return `MTD Ach <strong>${shop.samsung.mtd.ach}%</strong> đang hụt chủ yếu ở <strong>${worstCategory.name}</strong> và segment <strong>${worstSegment.name}</strong>. Model <strong>${promoModel.model}</strong> có ${promoModel.promo} nên dùng để kéo sellout ngắn hạn.`;
    }

    function activeCompetitorCompare() {
      return competitorCompareOptions.find(item => item.key === state.competitorCompare) || competitorCompareOptions[0];
    }

    function competitorDelta(item, index = 0) {
      const option = activeCompetitorCompare();
      const base = item.delta || 0;
      if (option.key === 'lw') return base;
      const direction = base === 0 ? (index % 2 === 0 ? 1 : -1) : Math.sign(base);
      const noise = option.key === 'l2w' ? (index % 3) - 1 : option.key === 'l4w' ? (index % 4) - 1 : (index % 5) - 2;
      return Math.round((base * option.factor + direction * Math.abs(noise) * 0.45) * 10) / 10;
    }

    function competitorDeltaTone(value) {
      return value > 0 ? 'up' : value < 0 ? 'down' : 'flat';
    }

    function competitorCompareSuffix() {
      return `vs ${activeCompetitorCompare().label}`;
    }

    function competitorDiagnosis(shop) {
      const ss = shop.competitor.shares.find(item => item.brand === 'SS');
      const biggestThreat = shop.competitor.shares
        .map((item, index) => ({ ...item, activeDelta: competitorDelta(item, index) }))
        .filter(item => item.brand !== 'SS')
        .sort((a, b) => (b.activeDelta || 0) - (a.activeDelta || 0))[0];
      const ssIndex = shop.competitor.shares.findIndex(item => item.brand === 'SS');
      return `SS đang giữ <strong>${ss.share}%</strong> contribution, biến động <strong>${signedText(competitorDelta(ss, ssIndex))} pts</strong> ${competitorCompareSuffix()}. Áp lực chính đến từ <strong>${biggestThreat.brand}</strong> tăng <strong>${signedText(biggestThreat.activeDelta)} pts</strong>, nên soi nhân sự, display, sellout và top model.`;

    function estimateTargetAmount(actualLabel, ach) {
      const raw = String(actualLabel || '').trim();
      const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)(.*)$/);
      if (!match) return raw;
      const value = Number(match[1]);
      const suffix = match[2] || '';
      const pct = Number(ach) || 0;
      if (!value || !pct) return raw;
      const target = value / (pct / 100);
      const decimals = suffix.toLowerCase().includes('b') ? 1 : 0;
      return `${target.toFixed(decimals)}${suffix}`;
    }

    function estimateTargetQty(actualQty, ach) {
      const qty = Number(actualQty) || 0;
      const pct = Number(ach) || 0;
      if (!qty || !pct) return qty;

    function modelInitials(name) {

    function rankLabel(rank) {

    }

    function competitorShareText(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return `${value}%`;
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function renderCompetitorVoronoi(shop) {
      const order = ['SS', 'LG', 'TCL', 'SN', 'OTHERS', 'TOS', 'HISEN'];
      const map = new Map(shop.competitor.shares.map(item => [item.brand, item]));
      const rows = order.map(brand => map.get(brand)).filter(Boolean);
      const rowIndex = new Map(rows.map((item, index) => [item.brand, index]));
      const explicitBrand = state.competitorBrand && rows.some(item => item.brand === state.competitorBrand) ? state.competitorBrand : null;
      const smallBrandOrder = ['TOS', 'HISEN', 'OTHERS'];
      const smallBrands = new Set(smallBrandOrder);
      const ssShare = Number(map.get('SS')?.share) || 59.5;
      const smallItemsForLayout = smallBrandOrder.map(brand => map.get(brand)).filter(Boolean);
      const smallTotal = smallItemsForLayout.reduce((sum, item) => sum + (Number(item.share) || 0), 0);
      const smallH = smallTotal > 0 ? Math.max(7.2, Math.min(11, smallTotal)) : 0;
      const mainH = Math.max(1, 100 - smallH);
      const topCompetitorTotal = ['LG', 'TCL', 'SN'].reduce((sum, brand) => sum + (Number(map.get(brand)?.share) || 0), 0);
      const rightXBySamsung = ssShare / mainH * 100;
      const rightXByCompetitors = 100 - (topCompetitorTotal / mainH * 100);
      const rightX = Math.max(44, Math.min(70, (rightXBySamsung + rightXByCompetitors) / 2));
      const rightW = Math.max(1, 100 - rightX);
      const layout = {};
      layout.SS = { x: 0, y: 0, w: rightX, h: mainH };

      const topRawHeights = ['LG', 'TCL', 'SN'].map(brand => {
        const item = map.get(brand);
        const rawH = item ? ((Number(item.share) || 0) / rightW * 100) : 0;
        return { brand, rawH };
      });
      const rawTotalH = topRawHeights.reduce((sum, item) => sum + item.rawH, 0) || mainH;
      const scaleH = mainH / rawTotalH;
      let cursorY = 0;
      topRawHeights.forEach(({ brand, rawH }, index) => {
        const item = map.get(brand);
        if (!item) return;
        const h = index === topRawHeights.length - 1 ? Math.max(0, mainH - cursorY) : rawH * scaleH;
        layout[brand] = { x: rightX, y: cursorY, w: rightW, h };
        cursorY += h;
      });

      const smallY = mainH;
      let smallX = 0;
      smallItemsForLayout.forEach((item, index) => {
        const remainingBrands = smallItemsForLayout.slice(index);
        const remainingShare = remainingBrands.reduce((sum, row) => sum + (Number(row.share) || 0), 0) || 1;
        const remainingW = Math.max(0, 100 - smallX);
        const w = index === smallItemsForLayout.length - 1 ? remainingW : ((Number(item.share) || 0) / remainingShare) * remainingW;
        layout[item.brand] = { x: smallX, y: smallY, w, h: smallH };
        smallX += w;
      });

      function treemapTextVars(box, isSmall, share) {
        if (isSmall) return '--brand-fs:0px;--value-fs:0px;--cell-pad:0px;';
        const shareNum = Math.max(0, Number(share) || 0);
        const area = Math.max(0, (Number(box.w) || 0) * (Number(box.h) || 0) / 100);
        const root = Math.sqrt(area);
        let valueFs = 16 + root * 2.4;
        if (shareNum >= 50) valueFs = 42;
        else if (shareNum >= 12) valueFs = 25;

        else if (shareNum >= 8) valueFs = 21;
        valueFs = Math.round(Math.max(18, Math.min(42, valueFs)) * 10) / 10;

        if (shareNum >= 50) brandFs = 14.5;
        else if (shareNum >= 12) brandFs = 12.1;
        else if (shareNum >= 8) brandFs = 11.3;
        brandFs = Math.round(Math.max(10.2, Math.min(14.5, brandFs)) * 10) / 10;
        const cellPad = Math.round(Math.max(8, Math.min(14, shareNum >= 50 ? 14 : 7 + root * .55)) * 10) / 10;
        return `--brand-fs:${brandFs}px;--value-fs:${valueFs}px;--cell-pad:${cellPad}px;`;
      }

        return `${sign}${display}%${withSuffix ? ` vs ${activeCompetitorCompare().label}` : ''}`;
      }

      const smallItems = smallBrandOrder.map(brand => map.get(brand)).filter(Boolean);

    function renderCompetitorStoreInsight(shop) {
      const rows = shop.competitor.shares.filter(item => item.brand !== 'OTHERS')

      const ss = rows.find(item => item.brand === 'SS') || rows[0];
      const rivals = rows.filter(item => item.brand !== 'SS');
      const topGrower = [...rivals].sort((a, b) => (b.activeDelta - a.activeDelta) || (b.share - a.share))[0] || rivals[0] || ss;
      const topShare = [...rivals].sort((a, b) => b.share - a.share)[0] || topGrower;
      const focus = topGrower.activeDelta > 0 ? topGrower : topShare;
      const ssDelta = Number(ss?.activeDelta || 0);
      const focusDelta = Number(focus?.activeDelta || 0);
      const ssTone = competitorDeltaTone(ssDelta);
      const focusTone = competitorDeltaTone(focusDelta);
      const peopleShare = pct(competitorPeopleForBrand(shop, focus.brand), competitorPeopleTotal(shop));
      const displayShare = pct(competitorDisplayBays(shop, focus.brand), competitorDisplayTotal(shop));
      const ssLead = ssDelta < 0
        ? `SS giảm ${signedText(ssDelta)} pts tại shop; ưu tiên kiểm tra brand đối thủ đang kéo share ngay trong bảng driver.`

      const focusLead = focusDelta > 0
        ? `${competitorBrandLabel(focus.brand)} là brand tăng đáng chú ý nhất tại cửa hàng này.`
        : `${competitorBrandLabel(focus.brand)} là brand đối thủ có IHS lớn nhất cần theo dõi tại cửa hàng này.`;

        <div class="detail-section-head"><div><h3>Nhận xét tại cửa hàng</h3><small>View 1 shop: chỉ đọc theo IHS, nhân sự và display tại shop này.</small></div><span class="section-badge">${activeCompetitorCompare().label}</span></div>

          <div class="expansion-score-row">
            <div class="expansion-score"><small>SS IHS</small><strong>${ss.share}%</strong></div>
            <div class="expansion-score"><small>Brand cần soi</small><strong>${competitorBrandLabel(focus.brand)}</strong></div>
            <div class="expansion-score"><small>Biến động</small><strong class="delta-${focusTone}">${signedText(focusDelta)} pts</strong></div>
          </div>
          <div class="competitor-lift-grid">
            <div class="lift-mini"><small>IHS đối thủ</small><strong>${focus.share}%</strong></div>
            <div class="lift-mini"><small>Nhân sự tại shop</small><strong>${peopleShare}%</strong></div>
            <div class="lift-mini"><small>Display tại shop</small><strong>${displayShare}%</strong></div>

        </div>
      </section>`;
    }

      people: '.people-section',
      competitor: '.competitor-rank-section',
      pintoPin: '.pin-to-pin-section'
    };

    function updateCompetitorFilterDock(inDetail, content) {
      const dock = document.querySelector('.competitor-pin-filter-dock');
      if (!dock) return;
      if (!inDetail || !content) {
        dock.classList.remove('show');
        return;
      }
      const ranking = document.querySelector('.competitor-rank-section');
      const pinSection = document.querySelector('.pin-to-pin-section');
      if (!ranking || !pinSection) {
        dock.classList.remove('show');
        return;
      }
      const contentRect = content.getBoundingClientRect();
      const rankingTop = ranking.getBoundingClientRect().top - contentRect.top;
      const pinBottom = pinSection.getBoundingClientRect().bottom - contentRect.top;
      const shouldShowDock = rankingTop <= 46 && pinBottom > 42;
      dock.classList.toggle('show', shouldShowDock);
    }

    function updateDetailQuickNav() {
      const nav = $('#detailQuickNav');
      const content = $('#content');
      if (!nav || !content) return;
      const inDetail = state.tab === 'shops' && state.mode === 'detail';
      const shouldShow = inDetail && content.scrollTop > 185;
      nav.classList.toggle('show', shouldShow);
      nav.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
      updateCompetitorFilterDock(inDetail, content);

      const buttons = nav.querySelectorAll('[data-quick]');
      buttons.forEach(button => button.classList.remove('active'));
      if (!shouldShow) return;

      let activeKey = 'sales';
      const contentRect = content.getBoundingClientRect();
      ['sales', 'display', 'people', 'competitor', 'pintoPin'].forEach(key => {
        const el = document.querySelector(quickNavSelectors[key]);
        if (!el) return;
        const top = el.getBoundingClientRect().top - contentRect.top;
        if (top <= 78) activeKey = key;
      });
      const activeButton = nav.querySelector(`[data-quick="${activeKey}"]`);
      if (activeButton) activeButton.classList.add('active');
    }

    function scrollToDetailTarget(key) {
      const content = $('#content');
      const selector = quickNavSelectors[key];
      if (!content || !selector) return;
      requestAnimationFrame(() => {
        const el = document.querySelector(selector);
        if (!el) return;
        const contentRect = content.getBoundingClientRect();
        const top = content.scrollTop + el.getBoundingClientRect().top - contentRect.top - 8;
        content.scrollTo({ top, behavior: 'smooth' });
        updateDetailQuickNav();
      });
    }

    function handleQuickJump(key) {
      if (state.mode !== 'detail') return;
      scrollToDetailTarget(key);
    }


    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.dataset.view === tab));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.tab === tab));
      const title = $('#screenTitle');
      if (title) title.textContent = titleMap[tab] || 'Shop Listing';
      $('#content').scrollTop = 0;
      if (tab !== 'shops') state.mode = 'listing';

      if (phone) phone.classList.toggle('home-phase-recovery', tab === 'home');
      updateHomePhaseChrome();
      if (tab === 'home') renderHomePage();
      if (tab === 'shops') renderShopPage();
      updateDetailQuickNav();
    }

        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        const isTreemapCell = !!target.closest('.treemap-map');
        const isDoubleClick = isTreemapCell && event.detail >= 2;
        state.competitorBrand = isDoubleClick ? '' : (target.dataset.brand || '');
        renderShopPage();

        renderShopPage();
        if (content) content.scrollTop = keepTop;
        return;
      }
      if (action === 'pin-segment') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinSegment = target.dataset.segment || 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'pin-lu') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinLU = target.dataset.lu || 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'pin-reset') {
        const content = $('#content');
        const keepTop = content ? content.scrollTop : 0;
        state.pinSegment = 'all';
        state.pinLU = 'all';
        renderShopPage();
        if (content) content.scrollTop = keepTop;
        updateDetailQuickNav();
        return;
      }
      if (action === 'detail-tab') {
        state.detailTab = target.dataset.detailTab;
        renderShopPage();
        $('#content').scrollTop = 0;
        updateDetailQuickNav();
        return;
      }
      if (action === 'show-more-display') {
        state.displayExpanded = true;
        renderShopPage();
        return;
      }
      if (action === 'show-more-staff') {
        state.staffExpanded = true;
        renderShopPage();
        return;
      }
      if (action === 'open-staff-calendar') {
        openStaffCalendar(target.dataset.staff);
        return;
      }
      if (action === 'load-more') {
        state.visibleLimit += SHOP_PAGE_SIZE;
        renderShopPage();
        return;
      }
      if (action === 'close-sheet') {
        closeSheet();
        return;
      }

    });

        input.setSelectionRange(pos, pos);
      }
    });

    function competitorSquareBrandLogo(brand) {
      return competitorSquareLogoAssets[normalizeCompetitorBrand(brand)] || '';
    }

    function hexToRgbTriplet(hex) {
      const clean = String(hex || '').replace('#', '').trim();
      if (clean.length === 3) {
        const r = parseInt(clean[0] + clean[0], 16);
        const g = parseInt(clean[1] + clean[1], 16);
        const b = parseInt(clean[2] + clean[2], 16);
        return `${r}, ${g}, ${b}`;
      }
      const value = parseInt(clean, 16);
      if (!Number.isFinite(value)) return '20, 40, 160';
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return `${r}, ${g}, ${b}`;
    }

    function driverCellVars(brand, heat = .5) {
      const colors = competitorTreemapStyle(brand);
      const safeHeat = Math.max(0, Math.min(1, Number(heat) || 0));
      const hi = (0.16 + safeHeat * 0.48).toFixed(2);
      const lo = (0.06 + safeHeat * 0.22).toFixed(2);
      return `--brand-border:${colors.border};--brand-fill:${colors.fill};--brand-text:${colors.text};--brand-rgb:${hexToRgbTriplet(colors.border)};--heat-hi:${hi};--heat-lo:${lo};`;
    }


    function driverMetricCellVars(metricKey, heat = .5) {
      const palette = {
        sellout: '#2563EB',
        people: '#7C3AED',
        display: '#0D9488'
      };
      const safeHeat = Math.max(0, Math.min(1, Number(heat) || 0));
      const hi = (0.14 + safeHeat * 0.56).toFixed(2);
      const lo = (0.055 + safeHeat * 0.26).toFixed(2);
      return `--metric-rgb:${hexToRgbTriplet(palette[metricKey] || '#2563EB')};--heat-hi:${hi};--heat-lo:${lo};`;
    }

    function driverHeatLookup(rows, getter) {
      const values = rows.map(row => Number(getter(row)) || 0);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(0.0001, max - min);
      return new Map(rows.map(row => {
        const raw = Number(getter(row)) || 0;
        const normalized = max === min ? .5 : (raw - min) / span;
        return [row.brand, normalized];
      }));
    }

    function driverPercentText(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '0%';
      return `${Number.isInteger(number) ? number : number.toFixed(1)}%`;
    }

    function driverDeltaPctText(value) {
      const num = Number(value) || 0;
      if (num === 0) return '0%';
      return `${signedText(num)}%`;
    }

    function driverDeltaSmall(delta) {

    function renderCompetitorDriverTable(shop) {
      const activeBrand = activeCompetitorBrand(shop);
      const peopleTotal = competitorPeopleTotal(shop);
      const displayTotal = competitorDisplayTotal(shop);
      const rows = shop.competitor.shares.map((item, index) => {
        const brand = item.brand;
        const ihsDelta = competitorDelta(item, index);
        const hc = competitorPeopleForBrand(shop, brand);
        const bay = competitorDisplayBays(shop, brand);
        return {
          ...item,
          brand,
          selloutPct: Number(item.share) || 0,
          peoplePct: pct(hc, peopleTotal),
          displayPct: pct(bay, displayTotal),
          ihsDelta,
          hcDelta: driverDeltaValue(brand, 'hc', ihsDelta),
          displayDelta: driverDeltaValue(brand, 'display', ihsDelta)
        };
      });

      const selloutHeat = driverHeatLookup(rows, row => row.selloutPct);
      const peopleHeat = driverHeatLookup(rows, row => row.peoplePct);
      const displayHeat = driverHeatLookup(rows, row => row.displayPct);
      const maxByMetric = {
        sellout: Math.max(...rows.map(row => row.selloutPct)),
        people: Math.max(...rows.map(row => row.peoplePct)),
        display: Math.max(...rows.map(row => row.displayPct))
      };

      const body = rows.map((row, index) => {
        const isActive = row.brand === activeBrand;
        const activeClass = isActive ? ' row-active' : '';
        const actionAttrs = row.brand === 'OTHERS' ? '' : `data-action="competitor-brand" data-brand="${row.brand}"`;
        return `${renderDriverBrandCell(row, index, activeClass, actionAttrs)}
          ${renderDriverMetricCell(row, 'sellout', row.selloutPct, row.ihsDelta, selloutHeat.get(row.brand), activeClass, actionAttrs, row.selloutPct === maxByMetric.sellout)}
          ${renderDriverMetricCell(row, 'people', row.peoplePct, row.hcDelta, peopleHeat.get(row.brand), activeClass, actionAttrs, row.peoplePct === maxByMetric.people)}
          ${renderDriverMetricCell(row, 'display', row.displayPct, row.displayDelta, displayHeat.get(row.brand), activeClass, actionAttrs, row.displayPct === maxByMetric.display)}`;
      }).join('');

      return `<div class="driver-shape-wrap">

          ${body}
        </div>

    function normalizeCompetitorBrand(brand) {
      const raw = String(brand || '').trim().toUpperCase();
      if (!raw) return 'OTHERS';
      if (raw === 'SAMSUNG' || raw === 'SS') return 'SS';
      if (raw === 'SONY' || raw === 'SN') return 'SN';
      if (raw === 'HISENSE' || raw === 'HISEN') return 'HISEN';
      if (raw === 'TOSHIBA' || raw === 'TOS') return 'TOS';
      if (raw.startsWith('LG')) return 'LG';
      if (raw.startsWith('TCL')) return 'TCL';
      return raw;
    }

    function modelGrowthSeed(text) {
      return String(text || '').split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
    }

    function parseTrendPercent(value) {
      const match = String(value || '').match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) : 0;
    }

    function competitorShareDeltaForBrand(shop, brand) {
      const normalized = normalizeCompetitorBrand(brand);
      const index = shop.competitor.shares.findIndex(item => normalizeCompetitorBrand(item.brand) === normalized);
      if (index < 0) return 0;
      return competitorDelta(shop.competitor.shares[index], index);
    }

    function inferredModelGrowth(shop, brand, model, sellout, fallback = 0) {
      const delta = competitorShareDeltaForBrand(shop, brand);
      const seed = modelGrowthSeed(model);
      const noise = ((seed % 9) - 3) * 2;
      const sizeBoost = Number(sellout) >= 55 ? 5 : Number(sellout) >= 25 ? 2 : 0;
      const value = fallback || Math.round(delta * 22 + noise + sizeBoost);
      return Math.max(-35, Math.min(130, value));
    }

    function topCompetitorModels(shop) {
      const modelMap = new Map();
      const add = (entry) => {
        if (!entry || !entry.model) return;
        const brand = normalizeCompetitorBrand(entry.brand);
        const model = String(entry.model).trim();
        const key = `${brand}|${model}`;
        const current = modelMap.get(key);
        const sellout = Math.max(0, Math.round(Number(entry.sellout) || 0));
        const growth = Number.isFinite(Number(entry.growth)) ? Math.round(Number(entry.growth)) : inferredModelGrowth(shop, brand, model, sellout);
        const next = { brand, model, sellout, growth };
        if (!current || sellout > current.sellout || growth > current.growth) modelMap.set(key, { ...current, ...next, sellout: Math.max(sellout, current?.sellout || 0), growth: Math.max(growth, current?.growth ?? -999) });
      };

      (shop.samsung.models || []).forEach((item) => {
        add({ brand: 'SS', model: item.model, sellout: item.qty || 0, growth: parseTrendPercent(item.trend) });
      });

      pinThreatRows(shop).forEach((row) => {
        add({ brand: 'SS', model: row.ss, sellout: row.ssIhs, growth: inferredModelGrowth(shop, 'SS', row.ss, row.ssIhs, shop.ihsDelta * 8) });
        row.threats.forEach((threat) => {
          add({ brand: threat.brand, model: threat.model, sellout: threat.ihs, growth: inferredModelGrowth(shop, threat.brand, threat.model, threat.ihs) });
        });
      });

      return Array.from(modelMap.values());
    }

      return `${item.sellout} sp`;

    // v38: lock rubber-band overscroll so the navigation chrome stays frozen.
    (function lockNavigationChrome() {
      let startY = 0;
      const scrollableSelector = '#content, #sheet';

      document.addEventListener('touchstart', function(event) {
        if (!event.touches || !event.touches.length) return;
        startY = event.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchmove', function(event) {
        if (!event.touches || !event.touches.length) return;

        if (event.target.closest('.bottom-nav')) {
          event.preventDefault();
          return;
        }

        const scroller = event.target.closest(scrollableSelector);
        if (!scroller) {
          event.preventDefault();
          return;
        }

        const currentY = event.touches[0].clientY;
        const pullingDown = currentY > startY;
        const atTop = scroller.scrollTop <= 0;
        const atBottom = Math.ceil(scroller.scrollTop + scroller.clientHeight) >= scroller.scrollHeight;

        if ((pullingDown && atTop) || (!pullingDown && atBottom)) {
          event.preventDefault();
        }
      }, { passive: false });
    })();

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      return {
        r: parseInt(clean.slice(0, 2), 16),
        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)
      };
    }

    function rgbToHex({ r, g, b }) {
      return '#' + [r, g, b].map(value => Math.round(value).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function mixHex(from, to, amount) {
      const a = hexToRgb(from);
      const b = hexToRgb(to);
      const t = clamp01(amount);
      return rgbToHex({
        r: a.r + (b.r - a.r) * t,
        g: a.g + (b.g - a.g) * t,
        b: a.b + (b.b - a.b) * t
      });
    }

    function rgbaFromHex(hex, alpha) {
      const c = hexToRgb(hex);
      return `rgba(${c.r},${c.g},${c.b},${alpha})`;
    }

    function monthHeatColor(day) {
      const stops = [
        { at: 0.00, color: '#245BFF' },
        { at: 0.38, color: '#0EA5E9' },
        { at: 0.55, color: '#F59E0B' },
        { at: 0.78, color: '#F97316' },
        { at: 1.00, color: '#EA580C' }
      ];
      const t = clamp01((day - 1) / 29);
      const nextIndex = stops.findIndex(stop => stop.at >= t);
      const right = stops[Math.max(1, nextIndex === -1 ? stops.length - 1 : nextIndex)];
      const left = stops[stops.indexOf(right) - 1] || stops[0];
      const local = right.at === left.at ? 0 : (t - left.at) / (right.at - left.at);
      return mixHex(left.color, right.color, local);
    }

    /* =========================================================
       v44 HOME ONLY — pie-accurate cumulative Weekly Ach Clock.
       Navigation untouched.
       Fix: color boundaries now follow the displayed cumulative %.
       Example: Week 1 = 27% means the first blue slice spans exactly
       0% → 27% of the 360° clock, not the old fixed 25% bucket.
       ========================================================= */
    function buildWeightedClockV24(activePhase) {
      const active = activePhase || activeHomePhase();
      const activeActualPct = clampV36(actualAchPctForPhaseV36(active), 0, 100);
      let previousEndPct = 0;
      const segments = weekAchMilestonesV36.map(week => {
        const phase = homePhaseScenarios.find(item => item.key === week.key) || active;
        const displayPct = clampV36(displayPctForWeekV38(week, active, activeActualPct), 0, 100);
        const endPct = clampV36(Math.max(displayPct, previousEndPct), previousEndPct, 100);
        const startPct = previousEndPct;
        const start = (startPct / 100) * 360;
        const end = (endPct / 100) * 360;
        const center = start === end ? (end || start) : (start + end) / 2;
        const isVisibleActual = week.order <= active.order;

        previousEndPct = endPct;

        return {
          key: week.key,
          order: week.order,
          startPct,
          endPct,
          label: `${week.label}: ${Math.round(displayPct)}%`,
          benchmarkLabel: `${week.label}: mốc ${Math.round(displayPct)}% trên vòng`,
          start,
          end,
          fillEnd: end,
          filledRatio: isVisibleActual ? 1 : 0,
          center,
          labelAngle: center,
          color: phaseColorV18(phase.key),
          ach: Math.round(displayPct)
        };
      });

      const gradientStops = [];
      segments.forEach(seg => {
        if (seg.end <= seg.start) return;
        const color = seg.order <= active.order ? seg.color : phaseClockEmptyV24;
        gradientStops.push(`${color} ${seg.start.toFixed(2)}deg ${seg.end.toFixed(2)}deg`);
      });
      if (previousEndPct < 100) {
        gradientStops.push(`${phaseClockEmptyV24} ${((previousEndPct / 100) * 360).toFixed(2)}deg 360deg`);
      }

      const pointerAngle = clampV36(activeActualPct, 0, 100) / 100 * 360;

      return {
        segments,
        actualPct: activeActualPct,
        expectedPct: expectedAchPctForPhaseV36(active),
        pointerAngle,
        gradient: `conic-gradient(from 0deg, ${gradientStops.join(', ')})`
      };
    }


    /* =========================================================
       v45 HOME ONLY — corrected with user logic.
       Rules:
       1) One full circle = 100% Ach.
       2) Week label is cumulative Ach at that checkpoint/current week.
          Slow means W1 <25, W2 <50, W3 <75, W4 <100.
       3) The outer clock ring is a pie-style Ach ring:
          W1 = 0→W1%, W2 = W1→W2%, W3 = W2→W3%, W4 = W3→W4%, remaining = empty.
          Example demo: 10 / 55 / 72 / 92 leaves 92→100 unfilled.
       Navigation untouched.
       ========================================================= */
    const demoWeekCumulativeAchV45 = {
      1: 10,
      2: 55,
      3: 72,
      4: 92
    };

    if (typeof homePhaseScenarios !== 'undefined') {
      const demoCenterByOrderV45 = { 1: '2.0B', 2: '11.0B', 3: '14.4B', 4: '18.4B' };
      const demoGapByOrderV45 = { 1: '-3.0B', 2: '+1.0B', 3: '-0.6B', 4: '-1.6B' };
      homePhaseScenarios.forEach(phase => {
        const order = Number(phase.order) || 1;
        if (demoCenterByOrderV45[order]) phase.center = demoCenterByOrderV45[order];
        if (demoGapByOrderV45[order]) phase.gap = demoGapByOrderV45[order];
        if (Number.isFinite(demoWeekCumulativeAchV45[order])) phase.forecast = `${demoWeekCumulativeAchV45[order]}%`;
      });
    }

    function cumulativeAchForWeekV45(order) {
      const value = demoWeekCumulativeAchV45[order];
      if (Number.isFinite(value)) return clampV36(value, 0, 100);
      const phase = homePhaseScenarios.find(item => item.order === order);
      return phase ? clampV36(actualAchPctForPhaseV36(phase), 0, 100) : clampV36(order * 25, 0, 100);
    }

    function actualAchPctForPhaseV36(phase) {
      const order = Math.max(1, Math.min(4, Number(phase && phase.order) || 1));
      const demo = demoWeekCumulativeAchV45[order];
      if (Number.isFinite(demo)) return clampV36(demo, 0, 100);
      const actual = numericFromDisplayV24(phase && phase.center);
      const target = numericFromDisplayV24(phase && phase.target);
      if (!target) return 0;
      return clampV36((actual / target) * 100, 0, 100);
    }

    function weekEndActualPctV38(order) {
      return cumulativeAchForWeekV45(order);
    }

    function displayPctForWeekV38(week, activePhase, activeActualPct) {
      if (week.order <= activePhase.order) return Math.round(cumulativeAchForWeekV45(week.order));
      return week.endPct;
    }

    function labelPctForWeekV36(week, activePhase, actualPct) {
      return displayPctForWeekV38(week, activePhase, actualPct);
    }

    function weekOutcomeForDisplayV41(week, activePhase, displayPct) {
      if (!week || !activePhase || week.order > activePhase.order) {
        return { key: 'future', text: '' };
      }
      const threshold = Number(week.endPct);
      const isHit = Number(displayPct) >= threshold;
      return isHit ? { key: 'hit', text: 'Đạt' } : { key: 'miss', text: 'Chưa đạt' };
    }

    function buildWeightedClockV24(activePhase) {
      const active = activePhase || activeHomePhase();
      const activeOrder = Math.max(1, Math.min(4, Number(active && active.order) || 1));
      const activeActualPct = clampV36(cumulativeAchForWeekV45(activeOrder), 0, 100);
      let previousActualPct = 0;

      const segments = weekAchMilestonesV36.map(week => {
        const phase = homePhaseScenarios.find(item => item.key === week.key) || active;
        const isPastOrActive = week.order <= activeOrder;
        const displayPct = isPastOrActive ? cumulativeAchForWeekV45(week.order) : week.endPct;
        const startPct = isPastOrActive ? previousActualPct : week.startPct;
        const endPct = isPastOrActive ? clampV36(Math.max(displayPct, previousActualPct), previousActualPct, 100) : week.endPct;
        const start = (startPct / 100) * 360;
        const end = (endPct / 100) * 360;
        const center = start === end ? (end || start) : (start + end) / 2;

        if (isPastOrActive) previousActualPct = endPct;

        return {
          key: week.key,
          order: week.order,
          startPct,
          endPct,
          label: `${week.label}: ${Math.round(displayPct)}%`,
          benchmarkLabel: `${week.label}: chuẩn ${week.endPct}%`,
          start,
          end,
          fillEnd: isPastOrActive ? end : start,
          filledRatio: isPastOrActive && end > start ? 1 : 0,
          center,
          labelAngle: center,
          color: phaseColorV18(phase.key),
          ach: Math.round(displayPct)
        };
      });

      const gradientStops = [];
      let cursor = 0;
      segments.forEach(seg => {
        if (seg.order <= activeOrder && seg.end > seg.start) {
          if (seg.start > cursor) {
            gradientStops.push(`${phaseClockEmptyV24} ${cursor.toFixed(2)}deg ${seg.start.toFixed(2)}deg`);
          }
          /* v49: pie keeps its original weekly colors; active/past/future emphasis is label-only. */
          gradientStops.push(`${seg.color} ${seg.start.toFixed(2)}deg ${seg.end.toFixed(2)}deg`);
          cursor = Math.max(cursor, seg.end);
        }
      });
      if (cursor < 360) gradientStops.push(`${phaseClockEmptyV24} ${cursor.toFixed(2)}deg 360deg`);

      return {
        segments,
        actualPct: activeActualPct,
        expectedPct: expectedAchPctForPhaseV36(active),
        pointerAngle: (activeActualPct / 100) * 360,
        gradient: `conic-gradient(from 0deg, ${gradientStops.join(', ')})`
      };
    }

    function timegoneMetricForPhaseV34(phase) {
      const expectedPct = expectedAchPctForPhaseV36(phase);
      const actualPct = actualAchPctForPhaseV36(phase);
      const fullTarget = numericFromDisplayV24(phase && phase.target);
      const actual = numericFromDisplayV24(phase && phase.center);
      const targetTG = fullTarget * expectedPct / 100;
      const gapTG = actual - targetTG;
      const isHit = actualPct >= expectedPct;
      return {
        targetTG: formatBillionV34(targetTG),
        gapTG: formatGapBillionV34(gapTG),
        status: isHit ? 'Đạt' : 'Chưa đạt',
        statusKey: isHit ? 'ok' : 'slow',
        gapKey: gapTG >= 0 ? 'ok' : 'risk'
      };
    }

            people: { color: '#081E73', text: '#081E73', soft: '#E8EDFF', angle: 42 },
            pace: { color: '#0057FF', text: '#1D4ED8', soft: '#EAF1FF', angle: 132 },
            store: { color: '#38BDF8', text: '#0369A1', soft: '#E0F2FE', angle: 222 },
            sprint: { color: '#2DD4BF', text: '#0F766E', soft: '#CCFBF1', angle: 318 },
            empty: '#E2E8F0'
          }
        },
        {
          id: 'alert',
          name: 'Alert Ops',
          desc: 'Blue, amber, orange, red — vấn đề nổi bật.',
          vars: {
            '--samsung-blue': '#1428A0', '--blue-500': '#F59E0B', '--blue-soft': '#FFF7E6',
            '--ink': '#111827', '--text': '#1F2937', '--muted': '#6B7280', '--subtle': '#9CA3AF',
            '--surface': '#FFF8F3', '--card': '#FFFFFF', '--line': 'rgba(220,38,38,.12)',
            '--warning': '#F59E0B', '--danger': '#DC2626', '--success': '#16A34A', '--purple': '#F97316',
            '--nav-active': '#DC2626', '--nav-active-soft': '#FEE2E2', '--nav-bg': 'rgba(255,255,255,.94)',
            '--nav-ink': '#1F2937', '--nav-muted': '#766B6B', '--nav-border': 'rgba(220,38,38,.13)', '--nav-press': '#FFF1F2',
            '--accent': '#DC2626', '--theme-bg-top': '#FFFFFF', '--theme-bg-bottom': '#FFF1E8',
            '--theme-dark-start': '#111827', '--theme-dark-end': '#991B1B', '--theme-shadow-blue': 'rgba(220,38,38,.18)'
          },
          phases: {
            people: { color: '#1428A0', text: '#1428A0', soft: '#EEF3FF', angle: 42 },
            pace: { color: '#F59E0B', text: '#B45309', soft: '#FEF3C7', angle: 132 },
            store: { color: '#F97316', text: '#C2410C', soft: '#FFEDD5', angle: 222 },
            sprint: { color: '#DC2626', text: '#991B1B', soft: '#FEE2E2', angle: 318 },
            empty: '#EFE4E0'
          }
        },
        {
          id: 'lime',
          name: 'Lime Orbit',
          desc: 'Blue, cyan, lime, green — fresh retail nhất.',
          vars: {
            '--samsung-blue': '#0B4DBA', '--blue-500': '#00B8D9', '--blue-soft': '#E6FAFF',
            '--ink': '#071A12', '--text': '#13261E', '--muted': '#60756E', '--subtle': '#9BAAA5',
            '--surface': '#F4FFF6', '--card': '#FFFFFF', '--line': 'rgba(22,163,74,.12)',
            '--warning': '#A3E635', '--danger': '#E11D48', '--success': '#16A34A', '--purple': '#65A30D',
            '--nav-active': '#16A34A', '--nav-active-soft': '#ECFDF5', '--nav-bg': 'rgba(251,255,252,.94)',
            '--nav-ink': '#13261E', '--nav-muted': '#657A71', '--nav-border': 'rgba(22,163,74,.13)', '--nav-press': '#ECFDF5',
            '--accent': '#16A34A', '--theme-bg-top': '#FFFFFF', '--theme-bg-bottom': '#EBFFE9',
            '--theme-dark-start': '#071A12', '--theme-dark-end': '#166534', '--theme-shadow-blue': 'rgba(22,163,74,.17)'
          },
          phases: {
            people: { color: '#0B4DBA', text: '#0B4DBA', soft: '#EAF2FF', angle: 42 },
            pace: { color: '#00B8D9', text: '#0E7490', soft: '#CFFAFE', angle: 132 },
            store: { color: '#A3E635', text: '#4D7C0F', soft: '#ECFCCB', angle: 222 },
            sprint: { color: '#16A34A', text: '#15803D', soft: '#DCFCE7', angle: 318 },
            empty: '#E1EDE5'
          }
        }
      ];

      const root = document.documentElement;
      const picker = document.getElementById('palettePicker');
      const trigger = document.getElementById('paletteTrigger');
      const triggerLabel = document.getElementById('paletteTriggerLabel');
      const menu = document.getElementById('paletteMenu');
      const list = document.getElementById('paletteList');
      const storageKey = 'pesam-v19-active-palette-v3';
      if (!picker || !trigger || !menu || !list) return;

      function safeGetStoredPalette() {
        try { return localStorage.getItem(storageKey) || localStorage.getItem('pesam-v19-active-palette'); } catch (error) { return null; }
      }

      function safeSetStoredPalette(id) {
        try {
          localStorage.setItem(storageKey, id);
          localStorage.setItem('pesam-v19-active-palette', id);
        } catch (error) {}
      }

      function paletteById(id) {
        return paletteOptions.find(item => item.id === id) || paletteOptions[0];
      }

      function setRootVars(vars) {
        Object.entries(vars || {}).forEach(([key, value]) => root.style.setProperty(key, value));
      }

      function setPhaseVars(palette) {
        const phases = palette.phases || {};
        ['people', 'pace', 'store', 'sprint'].forEach(key => {
          const phase = phases[key];
          if (!phase) return;
          root.style.setProperty(`--phase-${key}`, phase.color);
          root.style.setProperty(`--phase-${key}-text`, phase.text || phase.color);
          root.style.setProperty(`--phase-${key}-soft`, phase.soft || palette.vars['--blue-soft'] || '#EEF3FF');
        });
        root.style.setProperty('--phase-empty', phases.empty || '#E9EDF3');
      }

      function patchRuntimePalettes(palette) {
        const phases = palette.phases || {};
        const keys = ['people', 'pace', 'store', 'sprint'];
        keys.forEach(key => {
          const phase = phases[key];
          if (!phase) return;
          if (typeof phasePaletteV18 !== 'undefined' && phasePaletteV18[key]) {
            phasePaletteV18[key].color = phase.color;
            phasePaletteV18[key].text = phase.text || phase.color;
            phasePaletteV18[key].soft = phase.soft || palette.vars['--blue-soft'] || '#EEF3FF';
            if (Number.isFinite(phase.angle)) phasePaletteV18[key].angle = phase.angle;
          }
        });

        if (phases.empty && typeof phaseClockEmptyV24 !== 'undefined') {
          phaseClockEmptyV24 = phases.empty;
        }

        if (typeof phaseClockSegmentsV18 !== 'undefined') {
          phaseClockSegmentsV18.people = [phases.people.color, phases.empty, phases.empty, phases.empty];
          phaseClockSegmentsV18.pace = [phases.people.color, phases.pace.color, phases.empty, phases.empty];
          phaseClockSegmentsV18.store = [phases.people.color, phases.pace.color, phases.store.color, phases.empty];
          phaseClockSegmentsV18.sprint = [phases.people.color, phases.pace.color, phases.store.color, phases.sprint.color];
        }

        if (typeof homePhaseScenarios !== 'undefined') {
          homePhaseScenarios.forEach(phase => {
            const phaseStyle = phases[phase.key];
            if (!phaseStyle) return;
            phase.color = phaseStyle.color;
            phase.angle = Number.isFinite(phaseStyle.angle) ? phaseStyle.angle : phase.angle;
            if (Array.isArray(phase.quick)) {
              phase.quick = phase.quick.map(item => ({ ...item, color: phaseStyle.color }));
            }
          });
        }
      }

      function refreshInlineClock() {
        try {
          const phase = typeof activeHomePhase === 'function' ? activeHomePhase() : null;
          if (!phase || typeof buildWeightedClockV24 !== 'function') return;
          const clock = buildWeightedClockV24(phase);
          document.querySelectorAll('.home-combined-card, .home-market-hero').forEach(card => {
            card.style.setProperty('--phase-ring-gradient', clock.gradient);
            card.style.setProperty('--phase-angle', `${clock.pointerAngle.toFixed(2)}deg`);
            if (typeof phaseColorV18 === 'function') card.style.setProperty('--phase-active-color', phaseColorV18(phase.key));
            if (typeof phaseSoftColorV18 === 'function') card.style.setProperty('--phase-active-soft', phaseSoftColorV18(phase.key));
            if (typeof phaseTextColorV18 === 'function') card.style.setProperty('--phase-active-text', phaseTextColorV18(phase.key));
          });
        } catch (error) {}
      }

      function repaintCurrentView() {
        try { if (typeof updateHomePhaseChrome === 'function') updateHomePhaseChrome(); } catch (error) {}
        try {
          if (typeof state !== 'undefined') {
            if (state.tab === 'home' && typeof renderHomePage === 'function') renderHomePage();
            if (state.tab === 'shops' && typeof renderShopPage === 'function') renderShopPage();
            if (state.tab === 'detail' && typeof renderDetailPage === 'function') renderDetailPage();
          }
        } catch (error) {}
        refreshInlineClock();
        requestAnimationFrame(refreshInlineClock);
      }

      function updatePickerUI(palette) {
        const p = palette.phases;
        if (triggerLabel) triggerLabel.textContent = palette.name;
        const triggerSwatch = trigger.querySelector('.palette-trigger-swatch');
        if (triggerSwatch) {
          triggerSwatch.style.background = `conic-gradient(from -90deg, ${p.people.color} 0 25%, ${p.pace.color} 0 50%, ${p.store.color} 0 75%, ${p.sprint.color} 0 100%)`;
        }
        document.querySelectorAll('[data-palette-id]').forEach(button => {
          const active = button.dataset.paletteId === palette.id;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function applyPalette(id, showToast = true) {
        const palette = paletteById(id);
        setRootVars(palette.vars);
        setPhaseVars(palette);
        patchRuntimePalettes(palette);
        root.dataset.palette = palette.id;
        safeSetStoredPalette(palette.id);
        updatePickerUI(palette);
        repaintCurrentView();
        if (showToast && typeof toast === 'function') toast(`Đã đổi màu: ${palette.name}`);
      }

      function renderPaletteButtons() {
        list.innerHTML = paletteOptions.map(palette => {
          const p = palette.phases;
          return `
            <button class="palette-option" type="button" data-action="select-palette" data-palette-id="${palette.id}" aria-pressed="false" style="--swatch-a:${p.people.color};--swatch-b:${p.pace.color};--swatch-c:${p.store.color};--swatch-d:${p.sprint.color};">
              <span class="palette-option-swatch" aria-hidden="true"></span>
              <span class="palette-option-copy"><strong>${palette.name}</strong><small>${palette.desc}</small></span>
              <span class="palette-check" aria-hidden="true">✓</span>
            </button>`;
        }).join('');
      }

      function setPaletteOpen(isOpen) {
        picker.classList.toggle('open', isOpen);
        trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
      }

      window.pesamApplyPalette = applyPalette;
      window.pesamPaletteOptions = paletteOptions;

      renderPaletteButtons();
      applyPalette(safeGetStoredPalette() || 'classic', false);

      document.addEventListener('click', event => {
        const paletteButton = event.target.closest('[data-action="select-palette"]');
        if (paletteButton) {
          applyPalette(paletteButton.dataset.paletteId, true);
          setPaletteOpen(false);
          return;
        }

        const toggleButton = event.target.closest('[data-action="toggle-palette"]');
        if (toggleButton) {
          setPaletteOpen(!picker.classList.contains('open'));
          return;
        }

        const closeButton = event.target.closest('[data-action="close-palette"]');
        if (closeButton) {
          setPaletteOpen(false);
          return;
        }

        if (!picker.contains(event.target)) setPaletteOpen(false);
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') setPaletteOpen(false);
      });
    })();

    switchTab('home');
  </script>
</body>
</html>
